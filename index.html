<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chiquiOS // Native Web OS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="desktop">
    <div class="desktop-icon" style="top: 20px; left: 20px;" onclick="window.chiquiOS.openApp('terminal')">
      <span>💻</span>
      <p>Terminal</p>
    </div>
    <div class="desktop-icon" style="top: 120px; left: 20px;" onclick="window.chiquiOS.openApp('baco')">
      <span>🐢</span>
      <p>Baco.sh</p>
    </div>
    <div class="desktop-icon" style="top: 220px; left: 20px;" onclick="window.chiquiOS.openApp('texteditor')">
      <span>📝</span>
      <p>NanoPad</p>
    </div>
    <div class="desktop-icon" style="top: 320px; left: 20px;" onclick="window.chiquiOS.openApp('browsertortu')">
      <span>🐢🌐</span>
      <p>Browsertortu</p>
    </div>
    <div class="desktop-icon" style="top: 420px; left: 20px;" onclick="window.chiquiOS.openApp('vscodebacus')">
      <span>🐢💻</span>
      <p>vscodebacus</p>
    </div>
  </div>

  <!-- Menú de Inicio -->
  <div id="start-menu" class="hidden">
    <div class="start-header">⚡ chiquiOS (Native Engine)</div>
    <div class="start-item" onclick="window.chiquiOS.openApp('terminal'); toggleStartMenu();">💻 Terminal Nativa</div>
    <div class="start-item" onclick="window.chiquiOS.openApp('baco'); toggleStartMenu();">🐢 Monitor Baco Daemon</div>
    <div class="start-item" onclick="window.chiquiOS.openApp('texteditor'); toggleStartMenu();">📝 Editor NanoPad</div>
    <div class="start-item" onclick="window.chiquiOS.openApp('browsertortu'); toggleStartMenu();">🐢🌐 Browsertortu</div>
    <div class="start-item" onclick="window.chiquiOS.openApp('vscodebacus'); toggleStartMenu();">🐢💻 vscodebacus IDE</div>
    <div class="start-item" onclick="location.reload();">🔄 Reiniciar Sistema</div>
  </div>

  <!-- Barra de Tareas -->
  <div id="taskbar">
    <button class="start-menu-btn" onclick="toggleStartMenu()">⚡ chiquiOS</button>
    <div class="taskbar-apps" id="taskbar-apps"></div>
    <div class="taskbar-tray">
      <span>🐢 Baco: OK</span>
      <span id="sys-clock">00:00:00</span>
    </div>
  </div>

  <!-- Carga del Kernel y Módulos -->
  <script type="module" src="js/kernel.js"></script>
  <script>
    function toggleStartMenu() {
      const menu = document.getElementById('start-menu');
      menu.classList.toggle('hidden');
    }
    setInterval(() => {
      document.getElementById('sys-clock').textContent = new Date().toLocaleTimeString();
    }, 1000);
  </script>
</body>
</html>
