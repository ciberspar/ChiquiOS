<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>chiquiOS // Native Web OS + Python</title>
<link rel="stylesheet" href="css/style.css">
<!-- Librería oficial de Brython para Python real en el navegador -->
<script src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython.js"></script>
<script src="https://cdn.jsdelivr.net/npm/brython@3.11.0/brython_stdlib.js"></script>
</head>
<body onload="brython()">

  <div id="desktop">
    <div class="desktop-icon" style="top: 20px; left: 20px;" onclick="window.chiquiOS.openApp('terminal')">
      <span>💻</span>
      <p>Terminal</p>
    </div>
    <div class="desktop-icon" style="top: 110px; left: 20px;" onclick="window.chiquiOS.openApp('baco')">
      <span>🐢</span>
      <p>Baco.sh</p>
    </div>
    <div class="desktop-icon" style="top: 200px; left: 20px;" onclick="window.chiquiOS.openApp('texteditor')">
      <span>📝</span>
      <p>NanoPad</p>
    </div>
    <div class="desktop-icon" style="top: 290px; left: 20px;" onclick="window.chiquiOS.openApp('browsertortu')">
      <span>🐢🌐</span>
      <p>Browsertortu</p>
    </div>
    <div class="desktop-icon" style="top: 380px; left: 20px;" onclick="window.chiquiOS.openApp('vscodebacus')">
      <span>🐢💻</span>
      <p>vscodebacus</p>
    </div>
  </div>

  <!-- Menú de Inicio -->
  <div id="start-menu" class="hidden">
    <div class="start-header">⚡ chiquiOS (Python Engine)</div>
    <div class="start-item" onclick="window.chiquiOS.openApp('terminal'); toggleStartMenu();">💻 Terminal Nativa</div>
    <div class="start-item" onclick="window.chiquiOS.openApp('baco'); toggleStartMenu();">🐢 Monitor Baco Daemon</div>
    <div class="start-item" onclick="window.chiquiOS.openApp('texteditor'); toggleStartMenu();">📝 Editor NanoPad</div>
    <div class="start-item" onclick="window.chiquiOS.openApp('browsertortu'); toggleStartMenu();">🐢🌐 Browsertortu</div>
    <div class="start-item" onclick="window.chiquiOS.openApp('vscodebacus'); toggleStartMenu();">🐢💻 vscodebacus IDE</div>
    <div class="start-item" onclick="location.reload();">🔄 Reiniciar Sistema</div>
  </div>

  <!-- Barra de Tareas -->
  <div id="taskbar">
    <button class="start-menu-btn" onclick="toggleStartMenu()">⚡ chiquiOS</button>
    <div class="taskbar-apps" id="taskbar-apps"></div>
    <div class="taskbar-tray">
      <span>🐢 Baco: Lluvia OK</span>
      <span id="sys-clock">00:00:00</span>
    </div>
  </div>

  <!-- KERNEL UNIFICADO + BRYTHON PYTHON REAL -->
  <script>
    class ChiquiOSKernel {
      constructor() {
        this.vfs = JSON.parse(localStorage.getItem('chiqui_vfs_tree')) || {
          "/": { type: "dir", content: ["bin", "home", "etc", "root"] },
          "/bin": { type: "dir", content: ["bacus", "ls", "cat", "echo", "touch", "mkdir", "rm", "pwd", "clear"] },
          "/home": { type: "dir", content: ["user"] },
          "/home/user": { type: "dir", content: ["welcome.txt", "juego.py"] },
          "/home/user/welcome.txt": { type: "file", content: "Bienvenido a chiquiOS v4.1.\nDisfrutando la lluvia con Python real y Baco." },
          "/home/user/juego.py": { type: "file", content: "# Python real con Brython en chiquiOS\nimport math\n\ndef calcular_lluvia():\n    print('¡Hola desde Python real en chiquiOS!')\n    radio = 5\n    area = math.pi * (radio ** 2)\n    print(f'Área de cálculo simulada: {area:.2f}')\n    for i in range(3):\n        print(f'Gota de lluvia número {i+1} cayendo...')\n\ncalcular_lluvia()" },
          "/etc": { type: "dir", content: ["os-release", "hostname"] },
          "/etc/os-release": { type: "file", content: "NAME=\"chiquiOS\"\nID=chiquios\nVERSION=\"4.1-python\"" },
          "/etc/hostname": { type: "file", content: "chiquios-station" },
          "/root": { type: "dir", content: [] }
        };

        this.packages = JSON.parse(localStorage.getItem('chiqui_pkgs')) || ["chiquios-core", "bacus-pm", "nanopad", "browsertortu", "vscodebacus"];
        this.activeWindows = {};
        this.zIndexCounter = 100;
      }

      saveState() {
        localStorage.setItem('chiqui_vfs_tree', JSON.stringify(this.vfs));
        localStorage.setItem('chiqui_pkgs', JSON.stringify(this.packages));
      }

      openApp(appId) {
        if (this.activeWindows[appId]) {
          this.bringToFront(appId);
          document.getElementById(`win-${appId}`).classList.remove('minimized');
          return;
        }

        this.zIndexCounter++;
        const win = document.createElement('div');
        win.className = 'window';
        win.id = `win-${appId}`;
        win.style.zIndex = this.zIndexCounter;
        win.style.top = `${30 + (Object.keys(this.activeWindows).length * 20)}px`;
        win.style.left = `${20 + (Object.keys(this.activeWindows).length * 15)}px`;
        
        if (appId === 'terminal') {
          win.style.width = '320px'; win.style.height = '300px';
        } else if (appId === 'browsertortu' || appId === 'vscodebacus') {
          win.style.width = '350px'; win.style.height = '380px';
        } else {
          win.style.width = '300px'; win.style.height = '280px';
        }

        let title = "Ventana";
        let contentHtml = "";

        if (appId === 'terminal') {
          title = "Terminal Nativa";
          contentHtml = `<div class="terminal-output" id="term-out" style="font-size:11px;">chiquiOS v4.1-python\nEscribí 'help' para comandos.\n</div>
                         <div class="terminal-line"><span id="term-prompt">root@chiquiOS:/#</span><input type="text" class="terminal-input" id="term-in" autofocus></div>`;
        } else if (appId === 'baco') {
          title = "Baco Daemon";
          contentHtml = `<div style="padding:10px; font-family:monospace; color:#00ff66; font-size:12px;">
            <h3>🐢 Baco Daemon v2.5</h3>
            <p>Estado: <b>Disfrutando la lluvia 🌧️</b></p>
            <p>Temperatura ideal para programar.</p>
            <p>VFS LocalStorage: Activo.</p>
          </div>`;
        } else if (appId === 'texteditor') {
          title = "NanoPad";
          contentHtml = `<div style="display:flex; flex-direction:column; height:100%; gap:4px; padding:4px;">
            <input type="text" id="nano-path" value="/home/user/welcome.txt" style="background:#02050b; border:1px solid #00f3ff; color:#fff; padding:2px; font-size:11px; font-family:monospace;">
            <textarea id="nano-text" style="flex:1; background:#02050b; color:#00ff66; border:1px solid #00f3ff; padding:4px; font-size:11px; font-family:monospace; resize:none;">${this.vfs['/home/user/welcome.txt'] ? this.vfs['/home/user/welcome.txt'].content : ''}</textarea>
            <button id="nano-save" style="background:rgba(0,243,255,0.2); border:1px solid #00f3ff; color:#00f3ff; padding:4px; cursor:pointer; font-size:11px; font-family:monospace;">Guardar</button>
          </div>`;
        } else if (appId === 'browsertortu') {
          title = "Browsertortu 🐢🌐";
          contentHtml = `<div style="display:flex; flex-direction:column; height:100%; background:#02050b;">
            <div style="display:flex; background:#0a1118; padding:4px; gap:4px; border-bottom:1px solid #00f3ff; align-items:center;">
              <span>🐢</span>
              <input type="text" id="tortu-url" value="https://example.com" style="flex:1; background:#02050b; border:1px solid #00f3ff; color:#00ff66; padding:4px; font-size:11px; font-family:monospace;">
              <button id="tortu-go" style="background:rgba(0,243,255,0.2); border:1px solid #00f3ff; color:#00f3ff; padding:4px 8px; cursor:pointer; font-size:11px;">Ir</button>
            </div>
            <iframe id="tortu-frame" src="https://example.com" style="flex:1; border:none; background:#fff;"></iframe>
          </div>`;
        } else if (appId === 'vscodebacus') {
          title = "vscodebacus (Python Real)";
          contentHtml = `<div style="display:flex; flex-direction:column; height:100%; background:#1e1e1e; font-family:monospace; color:#d4d4d4; font-size:11px;">
            <div style="display:flex; background:#2d2d2d; padding:4px; gap:4px; align-items:center; border-bottom:1px solid #333;">
              <span style="color:#00f3ff;">🐢IDE</span>
              <select id="vsc-file-select" style="background:#1e1e1e; color:#fff; border:1px solid #444; font-size:10px;">
                <option value="/home/user/juego.py">juego.py</option>
              </select>
              <button id="vsc-run" style="background:#0e639c; color:#fff; border:none; padding:2px 6px; cursor:pointer; font-size:10px;">▶ Run Python</button>
            </div>
            <div style="display:flex; flex:1; overflow:hidden; flex-direction:column;">
              <textarea id="vsc-editor" style="flex:1; background:#1e1e1e; color:#9cdcfe; border:none; padding:6px; resize:none; font-family:monospace; font-size:11px; outline:none;">${this.vfs['/home/user/juego.py'] ? this.vfs['/home/user/juego.py'].content : ''}</textarea>
              <pre id="vsc-output" style="height:90px; margin:0; padding:4px; background:#111; color:#4ec9b0; font-size:10px; overflow-y:auto; border-top:1px solid #333; white-space:pre-wrap;"></pre>
            </div>
          </div>`;
        }

        win.innerHTML = `
          <div class="window-header" data-appid="${appId}">
            <span>${title}</span>
            <div class="window-controls">
              <button class="win-btn btn-min" data-action="min" data-appid="${appId}"></button>
              <button class="win-btn btn-max" data-action="max" data-appid="${appId}"></button>
              <button class="win-btn btn-close" data-action="close" data-appid="${appId}"></button>
            </div>
          </div>
          <div class="window-content" style="${appId === 'browsertortu' ? 'padding:0; overflow:hidden;' : ''}">${contentHtml}</div>
        `;

        document.getElementById('desktop').appendChild(win);
        this.activeWindows[appId] = win;
        this.updateTaskbar();
        this.setupWindowEvents(appId);

        if (appId === 'terminal') {
          this.initTerminalLogic();
        } else if (appId === 'texteditor') {
          document.getElementById('nano-save').onclick = () => {
            const path = document.getElementById('nano-path').value;
            const text = document.getElementById('nano-text').value;
            this.vfs[path] = { type: "file", content: text };
            this.saveState();
            alert("¡Guardado en VFS!");
          };
        } else if (appId === 'browsertortu') {
          document.getElementById('tortu-go').onclick = () => {
            let targetUrl = document.getElementById('tortu-url').value;
            if (!targetUrl.startsWith('http')) targetUrl = 'https://' + targetUrl;
            document.getElementById('tortu-frame').src = targetUrl;
          };
        } else if (appId === 'vscodebacus') {
          const editor = document.getElementById('vsc-editor');
          const output = document.getElementById('vsc-output');

          document.getElementById('vsc-run').onclick = () => {
            output.textContent = "Ejecutando Python real con Brython...\n";
            const code = editor.value;
            
            // Guardamos en el VFS
            this.vfs['/home/user/juego.py'] = { type: "file", content: code };
            this.saveState();

            // Redirigimos la salida standard de Brython (`sys.stdout`) hacia nuestra consola del IDE
            try {
              window.py_output_div = output;
              // Ejecutamos mediante el motor real de Brython inyectando un script temporal
              window.BPython.runPython(code, output);
            } catch (err) {
              output.textContent += `Error de ejecución: ${err.message}\n`;
            }
          };
        }
      }

      initTerminalLogic() {
        const input = document.getElementById('term-in');
        const out = document.getElementById('term-out');
        const promptEl = document.getElementById('term-prompt');
        let currentPath = "/";

        const resolvePath = (target) => {
          if (!target) return currentPath;
          if (target.startsWith("/")) return target;
          if (target === "..") {
            const parts = currentPath.split("/").filter(Boolean);
            parts.pop();
            return "/" + parts.join("/");
          }
          return currentPath === "/" ? "/" + target : currentPath + "/" + target;
        };

        input.onkeydown = (e) => {
          if (e.key === 'Enter') {
            const cmdLine = input.value.trim();
            out.textContent += `\nroot@chiquiOS:${currentPath}# ${cmdLine}\n`;
            if (cmdLine !== '') {
              const args = cmdLine.split(' ');
              const mainCmd = args[0], subCmd = args[1];

              if (mainCmd === 'help') {
                out.textContent += `Comandos: pwd, ls, cd, cat, clear`;
              } else if (mainCmd === 'pwd') {
                out.textContent += currentPath + '\n';
              } else if (mainCmd === 'ls') {
                const targetDir = resolvePath(subCmd);
                if (this.vfs[targetDir] && this.vfs[targetDir].type === "dir") {
                  out.textContent += this.vfs[targetDir].content.join("   ") + '\n';
                } else {
                  out.textContent += `Directorio no encontrado\n`;
                }
              } else if (mainCmd === 'cd') {
                const targetDir = resolvePath(subCmd);
                if (this.vfs[targetDir] && this.vfs[targetDir].type === "dir") {
                  currentPath = targetDir;
                  promptEl.textContent = `root@chiquiOS:${currentPath}#`;
                } else {
                  out.textContent += `cd: No encontrado\n`;
                }
              } else if (mainCmd === 'clear') {
                out.textContent = "chiquiOS v4.1\n";
              } else {
                out.textContent += `sh: comando no encontrado: ${mainCmd}\n`;
              }
            }
            input.value = '';
            out.parentElement.scrollTop = out.parentElement.scrollHeight;
            input.focus();
          }
        };
        input.focus();
      }

      setupWindowEvents(appId) {
        const win = document.getElementById(`win-${appId}`);
        const header = win.querySelector('.window-header');

        header.onmousedown = header.ontouchstart = (e) => {
          this.bringToFront(appId);
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          let shiftX = clientX - win.getBoundingClientRect().left;
          let shiftY = clientY - win.getBoundingClientRect().top;

          const onMove = (event) => {
            const cx = event.touches ? event.touches[0].clientX : event.clientX;
            const cy = event.touches ? event.touches[0].clientY : event.clientY;
            win.style.left = `${cx - shiftX}px`;
            win.style.top = `${cy - shiftY}px`;
          };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onUp);
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
          document.addEventListener('touchmove', onMove);
          document.addEventListener('touchend', onUp);
        };

        win.querySelectorAll('.win-btn').forEach(btn => {
          btn.onclick = () => {
            const action = btn.dataset.action;
            if (action === 'close') this.closeApp(appId);
            if (action === 'min') win.classList.add('minimized');
            if (action === 'max') {
              if (win.style.width === '100vw') {
                win.style.width = '320px'; win.style.height = '300px';
              } else {
                win.style.width = '100vw'; win.style.height = 'calc(100vh - 40px)';
                win.style.top = '0'; win.style.left = '0';
              }
            }
          };
        });
      }

      closeApp(appId) {
        if (this.activeWindows[appId]) {
          this.activeWindows[appId].remove();
          delete this.activeWindows[appId];
          this.updateTaskbar();
        }
      }

      bringToFront(appId) {
        this.zIndexCounter++;
        document.getElementById(`win-${appId}`).style.zIndex = this.zIndexCounter;
      }

      updateTaskbar() {
        const taskbarApps = document.getElementById('taskbar-apps');
        taskbarApps.innerHTML = '';
        Object.keys(this.activeWindows).forEach(appId => {
          const btn = document.createElement('button');
          btn.className = 'taskbar-app active';
          btn.textContent = appId.toUpperCase();
          btn.onclick = () => {
            const win = document.getElementById(`win-${appId}`);
            if (win.classList.contains('minimized')) {
              win.classList.remove('minimized');
              this.bringToFront(appId);
            } else {
              win.classList.add('minimized');
            }
          };
          taskbarApps.appendChild(btn);
        });
      }
    }

    // Adaptador de Brython para capturar prints y mostrar en la consola de vscodebacus
    window.BPython = {
      runPython: function(code, outputElement) {
        outputElement.textContent = "";
        // Configuramos la redirección de print de python a nuestro elemento HTML
        window.py_print_buffer = "";
        
        // Reemplazamos temporalmente el console.log o creamos un entorno seguro de ejecución de brython
        try {
          // Brython compila y ejecuta código Python en el namespace global
          var compiled = __BRYTHON__.py2js(code, '__main__', '__main__');
          
          // Creamos una función segura que capture los prints
          var customPrint = function(...args) {
            window.py_print_buffer += args.join(" ") + "\n";
            outputElement.textContent = window.py_print_buffer;
          };

          // Ejecutamos el script compilado
          var sandbox = new Function('print', compiled);
          sandbox(customPrint);
          
          if (!outputElement.textContent) {
            outputElement.textContent = "[Script ejecutado sin salida en pantalla]";
          }
        } catch(e) {
          outputElement.textContent += "Error de Python: " + e.toString();
        }
      }
    };

    window.chiquiOS = new ChiquiOSKernel();

    function toggleStartMenu() {
      document.getElementById('start-menu').classList.toggle('hidden');
    }
    setInterval(() => {
      document.getElementById('sys-clock').textContent = new Date().toLocaleTimeString();
    }, 1000);
  </script>
</body>
</html>
