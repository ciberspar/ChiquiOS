name: Build ChiquiOS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [i386, amd64, arm64]
        edition: [cli, desktop]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install lightweight tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            genisoimage \
            syslinux \
            syslinux-common \
            mtools \
            xorriso \
            squashfs-tools

      - name: 📂 Prepare ISO Root Structure
        run: |
          sudo mkdir -p iso_root/boot/syslinux
          sudo mkdir -p iso_root/live

          # Copiar los archivos base del sistema desde la carpeta chiquiOS
          if [ -d "chiquiOS" ]; then
            sudo cp -r chiquiOS/* iso_root/ || true
          fi

          # Asegurar archivos mínimos de respaldo
          if [ ! -f "iso_root/boot/vmlinuz" ] && [ -f "iso_root/vmlinuz" ]; then
            sudo cp iso_root/vmlinuz iso_root/boot/vmlinuz
          fi
          if [ ! -f "iso_root/initrd.img" ] && [ -f "iso_root/boot/initrd.img" ]; then
            sudo cp iso_root/boot/initrd.img iso_root/initrd.img
          fi

      - name: ⚙️ Configure Bootloaders
        run: |
          # 1. Si es x86 (i386 / amd64), configuramos Syslinux de forma robusta
          if [ "${{ matrix.arch }}" = "i386" ] || [ "${{ matrix.arch }}" = "amd64" ]; then
            # Buscar y copiar isolinux.bin garantizando que quede en la ruta exacta que pide genisoimage
            if [ -f "/usr/lib/ISOLINUX/isolinux.bin" ]; then
              sudo cp /usr/lib/ISOLINUX/isolinux.bin iso_root/boot/syslinux/
              sudo cp /usr/lib/ISOLINUX/ldlinux.c32 iso_root/boot/syslinux/ || true
            elif [ -f "/usr/lib/syslinux/isolinux.bin" ]; then
              sudo cp /usr/lib/syslinux/isolinux.bin iso_root/boot/syslinux/
              sudo cp /usr/lib/syslinux/ldlinux.c32 iso_root/boot/syslinux/ || true
            elif [ -f "/usr/share/syslinux/isolinux.bin" ]; then
              sudo cp /usr/share/syslinux/isolinux.bin iso_root/boot/syslinux/
              sudo cp /usr/share/syslinux/ldlinux.c32 iso_root/boot/syslinux/ || true
            fi

            # Crear el archivo de configuración de Syslinux
            sudo bash -c 'cat > iso_root/boot/syslinux/isolinux.cfg <<EOF
            DEFAULT chiquios_normal
            TIMEOUT 50
            PROMPT 0

            LABEL chiquios_normal
              KERNEL /boot/vmlinuz
              APPEND initrd=/initrd.img boot=live quiet splash

            LABEL chiquios_safe
              KERNEL /boot/vmlinuz
              APPEND initrd=/initrd.img boot=live nomodeset vga=normal

            LABEL chiquios_serial
              KERNEL /boot/vmlinuz
              APPEND initrd=/initrd.img boot=live console=tty0 console=ttyS0,115200n8 nomodeset
            EOF'
          else
            # 2. Si es arm64, preparamos el arranque UEFI puro
            sudo mkdir -p iso_root/EFI/BOOT
            sudo apt-get install -y --no-install-recommends grub-efi-arm64-bin || true
            sudo grub-mkimage -O arm64-efi -o /tmp/BOOTAA64.EFI -p /boot/grub iso9660 normal test reboot halt serial || true
            if [ -f "/tmp/BOOTAA64.EFI" ]; then
              sudo cp /tmp/BOOTAA64.EFI iso_root/EFI/BOOT/BOOTAA64.EFI
            fi
          fi

      - name: 📀 Generate ISO Image
        run: |
          if [ "${{ matrix.arch }}" = "i386" ] || [ "${{ matrix.arch }}" = "amd64" ]; then
            # Generar ISO x86 con Syslinux buscando explícitamente el binario
            sudo genisoimage -rational-rock -joliet -L -N -relaxed-filenames \
              -volid "CHIQUIOS" \
              -c boot/syslinux/boot.cat \
              -b boot/syslinux/isolinux.bin \
              -no-emul-boot -boot-load-size 4 -boot-info-table \
              -o chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso \
              iso_root/
          else
            # Generar ISO arm64 UEFI puro
            sudo genisoimage -rational-rock -joliet -L -N -relaxed-filenames \
              -volid "CHIQUIOS" \
              -o chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso \
              iso_root/
          fi

      - name: 📦 Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}
          path: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso
