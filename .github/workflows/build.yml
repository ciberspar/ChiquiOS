name: Build ChiquiOS CLI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build

      - name: Configure ChiquiOS
        run: |
          mkdir build-cli
          cd build-cli

          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures i386 \
            --binary-image iso-hybrid \
            --bootloaders syslinux \
            --archive-areas main \
            --debian-installer none \
            --iso-volume CHIQUIOS_CLI \
            --image-name ChiquiOS-CLI-i386

      - name: Build ISO
        run: |
          cd build-cli
          sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ChiquiOS-CLI-i386
          path: build-cli/*.iso
          if-no-files-found: error