
name: Build ChiquiOS

on:
  push:
    branches:
      - main
      - pruebas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChiquiOS i386 BIOS
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc binutils make

      - name: Limpiar compilación anterior
        run: make clean

      - name: Compilar ChiquiOS
        run: make

      - name: Comprobar imagen
        run: make check

      - name: Publicar imagen
        uses: actions/upload-artifact@v4
        with:
          name: ChiquiOS-i386-BIOS
          path: build/chiquios.img
          if-no-files-found: error
