
name: Build ChiquiOS

on:
  push:
    branches:
      - main
      - pruebas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build i386 and x86-64
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm gcc binutils make \
            xorriso qemu-system-x86

      - name: Limpiar compilaciones
        run: make clean

      # i386
      - name: Compilar i386
        run: make ARCH=i386

      - name: Verificar i386
        run: make ARCH=i386 check

      # x86-64
      - name: Compilar ISO x86-64 BIOS
        run: make ARCH=x86_64

      - name: Verificar ISO x86-64
        run: make ARCH=x86_64 check

      - name: Verificar formato ELF64
        run: |
          readelf -h build/x86_64/kernel.elf
          readelf -h build/x86_64/kernel.elf | grep -q ELF64
          nm build/x86_64/kernel.elf | grep -q " T _start"
          nm build/x86_64/kernel.elf | grep -q " T kernel_main"

      # Artefactos
      - name: Publicar imagen i386
        uses: actions/upload-artifact@v4
        with:
          name: ChiquiOS-i386-BIOS
          path: build/chiquios.img
          if-no-files-found: error

      - name: Publicar ISO x86-64
        uses: actions/upload-artifact@v4
        with:
          name: ChiquiOS-x86_64-ISO
          path: build/x86_64/ChiquiOS-x86_64.iso
          if-no-files-found: error
