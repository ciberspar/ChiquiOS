
name: Build ChiquiOS Live

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chiquios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86-iso:
    name: ISO ${{ matrix.arch }} / ${{ matrix.edition }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        arch: [i386, amd64]
        edition: [cli, desktop]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            qemu-user-static \
            binfmt-support \
            squashfs-tools \
            grub-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-ia32-bin \
            xorriso \
            mtools \
            dosfstools \
            file

      - name: Enable i386 emulation
        run: |
          sudo update-binfmts --enable qemu-i386 || true

      - name: Build root filesystem
        run: |
          chmod +x scripts/*.sh
          sudo bash scripts/build-rootfs.sh \
            "${{ matrix.arch }}" \
            "${{ matrix.edition }}"

      - name: Create bootable ISO
        run: |
          sudo bash scripts/make-image.sh \
            "${{ matrix.arch }}" \
            "${{ matrix.edition }}"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.arch }}-${{ matrix.edition }}-iso
          path: output/chiquiOS-${{ matrix.arch }}-${{ matrix.edition }}.iso
          if-no-files-found: error
          retention-days: 14

  build-arm64-rootfs:
    name: ARM64 root filesystem
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            qemu-user-static \
            binfmt-support \
            tar \
            xz-utils

      - name: Enable ARM64 emulation
        run: |
          sudo update-binfmts --enable qemu-aarch64 || true

      - name: Build ARM64 root filesystem
        run: |
          chmod +x scripts/*.sh
          sudo bash scripts/build-rootfs.sh arm64 desktop
          sudo tar -C work/arm64-desktop/rootfs \
            -czf output-chiquiOS-arm64-desktop-rootfs.tar.gz .

      - name: Upload ARM64 root filesystem
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-arm64-desktop-rootfs
          path: output-chiquiOS-arm64-desktop-rootfs.tar.gz
          if-no-files-found: error
          retention-days: 14
