name: Build chiquiOS ISOs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition: [cli, desktop]
        arch: [amd64, arm64, i386]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools genisoimage grub-pc-bin grub-efi-amd64-bin mtools dosfstools curl qemu-user-static

      - name: 🐧 Bootstrap Debian Rootfs & Install Kernel
        run: |
          # Bootstrap según arquitectura
          sudo debootstrap --variant=minbase --arch=${{ matrix.arch }} bookworm /tmp/chiquios-rootfs http://deb.debian.org/debian/

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            KERNEL_PKG="linux-image-amd64"
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            KERNEL_PKG="linux-image-arm64"
          elif [ "${{ matrix.arch }}" = "i386" ]; then
            KERNEL_PKG="linux-image-686"
          fi

          sudo chroot /tmp/chiquios-rootfs apt-get update
          sudo chroot /tmp/chiquios-rootfs apt-get install -y --no-install-recommends $KERNEL_PKG live-boot

      - name: 📁 Inject chiquiOS Custom Tree, Bacusp & Proper GRUB
        run: |
          sudo mkdir -p /tmp/chiquios-rootfs/usr/local/bin /tmp/chiquios-rootfs/etc/bacusp /tmp/chiquios-rootfs/boot/grub
          sudo curl -sSL "https://raw.githubusercontent.com/ciberspar/bacus-pkg/main/bin/bacusp" -o /tmp/chiquios-rootfs/usr/local/bin/bacusp
          sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/bacusp

          if [ -d "chiquiOS" ]; then
            sudo cp -r chiquiOS/* /tmp/chiquios-rootfs/ 2>/dev/null || true
          fi

          if [ "${{ matrix.edition }}" = "desktop" ]; then
            if [ -f "configs/grub-desktop.cfg" ]; then
              sudo cp configs/grub-desktop.cfg /tmp/chiquios-rootfs/boot/grub/grub.cfg
            fi
          else
            if [ -f "configs/grub-cli.cfg" ]; then
              sudo cp configs/grub-cli.cfg /tmp/chiquios-rootfs/boot/grub/grub.cfg
            fi
          fi

          if [ -d "/tmp/chiquios-rootfs/usr/local/bin" ]; then
            sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/* 2>/dev/null || true
          fi

          if [ ! -f "/tmp/chiquios-rootfs/etc/hostname" ]; then
            echo "chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}" | sudo tee /tmp/chiquios-rootfs/etc/hostname
          fi

      - name: 📦 Compress Rootfs to SquashFS
        run: |
          sudo mkdir -p iso_root/live
          sudo mksquashfs /tmp/chiquios-rootfs iso_root/live/filesystem.squashfs -comp xz

      - name: 💿 Copy Kernel and Initrd Safely
        run: |
          sudo mkdir -p iso_root/boot
          
          VMLINUZ_FILE=$(ls /tmp/chiquios-rootfs/boot/vmlinuz-* 2>/dev/null | head -n 1)
          INITRD_FILE=$(ls /tmp/chiquios-rootfs/boot/initrd.img-* 2>/dev/null | head -n 1)

          if [ -f "$VMLINUZ_FILE" ] && [ -f "$INITRD_FILE" ]; then
            sudo cp "$VMLINUZ_FILE" iso_root/vmlinuz
            sudo cp "$INITRD_FILE" iso_root/initrd.img
            sudo cp iso_root/vmlinuz iso_root/boot/vmlinuz
            sudo cp iso_root/initrd.img iso_root/boot/initrd.img
          else
            echo "❌ Error crítico: No se encontró vmlinuz o initrd.img"
            exit 1
          fi

      - name: 📀 Generate ISO Image
        run: |
          sudo mkdir -p iso_root/boot/grub

          if [ -f "/tmp/chiquios-rootfs/boot/grub/grub.cfg" ]; then
            sudo cp /tmp/chiquios-rootfs/boot/grub/grub.cfg iso_root/boot/grub/grub.cfg
          fi

          # Para x86 (i386 / amd64), armar El Torito limpio y compatible
          if [ "${{ matrix.arch }}" = "i386" ] || [ "${{ matrix.arch }}" = "amd64" ]; then
            sudo mkdir -p iso_root/boot/grub/i386-pc
            
            # Módulos clave de arranque BIOS (sin módulos inexistentes)
            sudo grub-mkimage -O i386-pc -o iso_root/boot/grub/i386-pc/eltorito.img -p /boot/grub \
              iso9660 biosdisk normal test reboot halt vga vbe video_bochs video_cirrus gfxterm font video all_video serial
            
            if [ -d "/usr/lib/grub/i386-pc" ]; then
              sudo cp -r /usr/lib/grub/i386-pc/* iso_root/boot/grub/i386-pc/ 2>/dev/null || true
            fi

            sudo genisoimage -rational-rock -joliet -volid "CHIQUIOS" \
              -b boot/grub/i386-pc/eltorito.img \
              -c boot/grub/boot.catalog \
              -no-emul-boot -boot-load-size 4 -boot-info-table \
              -o chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso iso_root/
          else
            # Para ARM64 (Pure UEFI)
            sudo genisoimage -rational-rock -joliet -volid "CHIQUIOS" \
              -o chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso iso_root/
          fi

      - name: 🚀 Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}-iso
          path: chiquiOS-*.iso
