name: Build ChiquiOS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [i386, amd64, arm64]
        edition: [cli, desktop]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso \
            genisoimage \
            grub-pc-bin \
            mtools \
            squashfs-tools \
            grub-common \
            docker.io

      - name: 📦 Generate Base Debian Rootfs & Merge User Files
        run: |
          sudo mkdir -p iso_root
          
          # Extraer el sistema base oficial de Debian usando Docker de forma ultrarrápida
          echo "Obteniendo sistema base Debian..."
          docker pull debian:stable-slim
          CONTAINER_ID=$(docker create debian:stable-slim)
          docker export "$CONTAINER_ID" -o /tmp/debian-rootfs.tar
          docker rm "$CONTAINER_ID"
          
          # Descomprimir la base de Debian en la raíz de la ISO
          sudo tar -xf /tmp/debian-rootfs.tar -C iso_root/
          
          # Fusionar las carpetas del usuario (boot, etc) encima del sistema base
          if [ -d "chiquiOS" ]; then
            sudo cp -r chiquiOS/* iso_root/ || true
          fi

          # Asegurar directorios críticos del sistema operativo vivo
          sudo mkdir -p iso_root/boot/grub
          sudo mkdir -p iso_root/live
          sudo mkdir -p iso_root/proc iso_root/sys iso_root/dev

      - name: 📀 Generate ISO Image (Universal Hybrid)
        run: |
          # Copiar la configuración de GRUB según la edición
          if [ "${{ matrix.edition }}" = "desktop" ]; then
            if [ -f "iso_root/boot/grub/grub-desktop.cfg" ]; then
              sudo cp iso_root/boot/grub/grub-desktop.cfg iso_root/boot/grub/grub.cfg
            fi
          else
            if [ -f "iso_root/boot/grub/grub-cli.cfg" ]; then
              sudo cp iso_root/boot/grub/grub-cli.cfg iso_root/boot/grub/grub.cfg
            fi
          fi

          if [ "${{ matrix.arch }}" = "i386" ] || [ "${{ matrix.arch }}" = "amd64" ]; then
            # x86: Imagen híbrida con grub-mkrescue
            sudo grub-mkrescue -o chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso iso_root/ -- -volid "CHIQUIOS"
          else
            # arm64: UEFI puro para emuladores
            sudo mkdir -p iso_root/EFI/BOOT
            sudo wget -qO /tmp/BOOTAA64.EFI https://github.com/ciberspar/ChiquiOS/raw/main/EFI/BOOT/BOOTAA64.EFI || true
            if [ -f "/tmp/BOOTAA64.EFI" ]; then
              sudo cp /tmp/BOOTAA64.EFI iso_root/EFI/BOOT/BOOTAA64.EFI
            fi
            
            sudo xorriso -as mkisofs -iso-level 3 -full-iso9660-filenames \
              -volid "CHIQUIOS" \
              -output chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso \
              iso_root/
          fi

      - name: 📦 Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}
          path: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso
