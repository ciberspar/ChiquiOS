
name: Build ChiquiOS 0.4 ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x86 BIOS ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            gcc \
            binutils \
            make \
            xorriso

      - name: Clean previous build
        run: make clean

      - name: Compile ChiquiOS
        run: make

      - name: Check kernel and image
        run: make check

      - name: Build bootable ISO
        run: make iso

      - name: Verify generated files
        run: |
          test -f build/chiquios.img
          test -f build/chiquios.iso
          ls -lh build/chiquios.img build/chiquios.iso
          file build/chiquios.iso

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: ChiquiOS-0.4-Disk
          path: build/chiquios.img
          if-no-files-found: error

      - name: Upload ISO image
        uses: actions/upload-artifact@v4
        with:
          name: ChiquiOS-0.4-ISO
          path: build/chiquios.iso
          if-no-files-found: error
