name: Build chiquiOS ISOs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition: [cli, desktop]
        arch: [amd64, arm64, i386]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Install Build Dependencies & QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools genisoimage grub-pc-bin grub-efi-amd64-bin mtools dosfstools curl qemu-user-static binfmt-support xorriso grub-common

      - name: 🐧 Bootstrap Debian Rootfs & Install Kernel
        run: |
          # Registrar ejecutables de QEMU para soporte multi-arquitectura limpio
          sudo update-binfmts --enable

          # Bootstrap específico para la arquitectura actual de la matriz
          sudo debootstrap --variant=minbase --arch=${{ matrix.arch }} bookworm /tmp/chiquios-rootfs http://deb.debian.org/debian/

          # Seleccionar el paquete de kernel adecuado según la arquitectura
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            KERNEL_PKG="linux-image-amd64"
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            KERNEL_PKG="linux-image-arm64"
          elif [ "${{ matrix.arch }}" = "i386" ]; then
            KERNEL_PKG="linux-image-686"
          fi

          # Instalar el kernel, live-boot y dependencias EFI si aplica
          sudo chroot /tmp/chiquios-rootfs apt-get update
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo chroot /tmp/chiquios-rootfs apt-get install -y --no-install-recommends $KERNEL_PKG live-boot grub-efi-arm64
          else
            sudo chroot /tmp/chiquios-rootfs apt-get install -y --no-install-recommends $KERNEL_PKG live-boot
          fi

      - name: 📁 Inject chiquiOS Custom Tree & Bacusp
        run: |
          sudo mkdir -p /tmp/chiquios-rootfs/usr/local/bin /tmp/chiquios-rootfs/etc/bacusp /tmp/chiquios-rootfs/boot/grub
          sudo curl -sSL "https://raw.githubusercontent.com/ciberspar/bacus-pkg/main/bin/bacusp" -o /tmp/chiquios-rootfs/usr/local/bin/bacusp
          sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/bacusp

          # Inyectar archivos personalizados generales si existen en la carpeta chiquiOS/
          if [ -d "chiquiOS" ]; then
            sudo cp -r chiquiOS/* /tmp/chiquios-rootfs/ 2>/dev/null || true
          fi

          if [ -d "/tmp/chiquios-rootfs/usr/local/bin" ]; then
            sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/* 2>/dev/null || true
          fi

          if [ ! -f "/tmp/chiquios-rootfs/etc/hostname" ]; then
            echo "chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}" | sudo tee /tmp/chiquios-rootfs/etc/hostname
          fi

      - name: 📦 Compress Rootfs to SquashFS
        run: |
          sudo mkdir -p iso_root/live
          sudo mksquashfs /tmp/chiquios-rootfs iso_root/live/filesystem.squashfs -comp xz

      - name: 💿 Copy Kernel and Initrd Safely
        run: |
          sudo mkdir -p iso_root/boot
          
          # Buscar de forma segura los archivos generados del kernel
          VMLINUZ_FILE=$(ls /tmp/chiquios-rootfs/boot/vmlinuz-* 2>/dev/null | head -n 1)
          INITRD_FILE=$(ls /tmp/chiquios-rootfs/boot/initrd.img-* 2>/dev/null | head -n 1)

          if [ -f "$VMLINUZ_FILE" ] && [ -f "$INITRD_FILE" ]; then
            sudo cp "$VMLINUZ_FILE" iso_root/vmlinuz
            sudo cp "$INITRD_FILE" iso_root/initrd.img
            sudo cp iso_root/vmlinuz iso_root/boot/vmlinuz
            sudo cp iso_root/initrd.img iso_root/boot/initrd.img
          else
            echo "❌ Error crítico: No se encontró vmlinuz o initrd.img en /tmp/chiquios-rootfs/boot/"
            exit 1
          fi

      - name: 📀 Generate ISO Image
        run: |
          # 1. Crear directorio de GRUB en la raíz de la ISO
          sudo mkdir -p iso_root/boot/grub

          # 2. Copiar la configuración según la edición directamente a iso_root
          if [ "${{ matrix.edition }}" = "desktop" ]; then
            if [ -f "configs/grub-desktop.cfg" ]; then
              sudo cp configs/grub-desktop.cfg iso_root/boot/grub/grub.cfg
            fi
          else
            if [ -f "configs/grub-cli.cfg" ]; then
              sudo cp configs/grub-cli.cfg iso_root/boot/grub/grub.cfg
            fi
          fi

          # 3. Generar la ISO
          if [ "${{ matrix.arch }}" = "i386" ] || [ "${{ matrix.arch }}" = "amd64" ]; then
            # grub-mkrescue embebe el iso_root/boot/grub/grub.cfg para armar el menú directo
            sudo grub-mkrescue -o chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso iso_root/ -- -volid "CHIQUIOS"
          else
            # Para ARM64 (Pure UEFI)
            sudo mkdir -p iso_root/EFI/BOOT
            sudo chroot /tmp/chiquios-rootfs grub-mkimage -O arm64-efi -o /tmp/BOOTAA64.EFI -p /boot/grub iso9660 normal test reboot halt serial
            sudo cp /tmp/chiquios-rootfs/tmp/BOOTAA64.EFI iso_root/EFI/BOOT/BOOTAA64.EFI
            
            sudo genisoimage -rational-rock -joliet -L -N -relaxed-filenames -volid "CHIQUIOS" \
              -o chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso iso_root/
          fi

      - name: 🚀 Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}-iso
          path: chiquiOS-*.iso
