name: 🍓 Build chiquiOS Universal (Matrix All-Arch)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-chiquios:
    name: ⚙️ Build ${{ matrix.edition }} (${{ matrix.name_suffix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: cli
            deb_arch: amd64
            name_suffix: x64
          - edition: cli
            deb_arch: i386
            name_suffix: x32
          - edition: cli
            deb_arch: arm64
            name_suffix: arm64
          - edition: desktop
            deb_arch: amd64
            name_suffix: x64
          - edition: desktop
            deb_arch: i386
            name_suffix: x32
          - edition: desktop
            deb_arch: arm64
            name_suffix: arm64

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install Host Build Tools & Emulation
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools genisoimage xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools qemu-user-static qemu-system-x86 ovmf binfmt-support curl git

      - name: 🐧 Bootstrap Debian Base (${{ matrix.deb_arch }})
        run: |
          sudo mkdir -p /tmp/chiquios-rootfs
          sudo debootstrap --arch=${{ matrix.deb_arch }} --variant=minbase bookworm /tmp/chiquios-rootfs http://deb.debian.org/debian/

      - name: 🎨 Install Desktop UI (Solo versión Desktop)
        if: matrix.edition == 'desktop'
        run: |
          sudo chroot /tmp/chiquios-rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              xorg lxde-core pcmanfm lxpanel openbox lightdm netsurf-gtk sudo curl ca-certificates
          "

      - name: 🐢 Install Kernel & Core Packages (${{ matrix.name_suffix }})
        run: |
          sudo chroot /tmp/chiquios-rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y linux-image-generic || apt-get install -y linux-image-amd64 || apt-get install -y linux-image-arm64 || true
          "

          # Normalizar los nombres del kernel e initrd en el rootfs
          sudo bash -c '
            cd /tmp/chiquios-rootfs/boot
            cp vmlinuz-* vmlinuz 2>/dev/null || true
            cp initrd.img-* initrd.img 2>/dev/null || true
          '

          # Instalar paquetes de bootloader dentro del chroot según la arquitectura
          if [ "${{ matrix.deb_arch }}" = "arm64" ]; then
            sudo chroot /tmp/chiquios-rootfs /bin/bash -c "apt-get install -y grub-efi-arm64-bin grub-efi-arm64"
            sudo mkdir -p /tmp/chiquios-rootfs/EFI/BOOT
            sudo cp /tmp/chiquios-rootfs/usr/lib/grub/arm64-efi/monolithic/grubaa64.efi /tmp/chiquios-rootfs/EFI/BOOT/BOOTAA64.EFI 2>/dev/null || \
            sudo cp /tmp/chiquios-rootfs/usr/lib/grub/arm64-efi/grubaa64.efi /tmp/chiquios-rootfs/EFI/BOOT/BOOTAA64.EFI 2>/dev/null || true
          elif [ "${{ matrix.deb_arch }}" = "amd64" ]; then
            sudo chroot /tmp/chiquios-rootfs /bin/bash -c "apt-get install -y grub-pc-bin grub-efi-amd64-bin grub2-common"
          else
            sudo chroot /tmp/chiquios-rootfs /bin/bash -c "apt-get install -y grub-pc-bin grub2-common"
          fi

      - name: 📁 Inject chiquiOS Custom Tree & Bacusp
        run: |
          # 1. Inyectamos tu gestor bacusp
          sudo mkdir -p /tmp/chiquios-rootfs/usr/local/bin /tmp/chiquios-rootfs/etc/bacusp
          sudo curl -sSL "https://raw.githubusercontent.com/ciberspar/bacus-pkg/main/bin/bacusp" -o /tmp/chiquios-rootfs/usr/local/bin/bacusp
          sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/bacusp

          # 2. Copiamos toda tu estructura local de la carpeta chiquiOS/ (boot, etc, usr, etc.)
          if [ -d "chiquiOS" ]; then
            sudo cp -r chiquiOS/* /tmp/chiquios-rootfs/ 2>/dev/null || true
          fi

          # Dar permisos de ejecución a cualquier binario que hayas puesto en usr/local/bin
          if [ -d "/tmp/chiquios-rootfs/usr/local/bin" ]; then
            sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/* 2>/dev/null || true
          fi

          # Si no creaste un hostname propio en tu carpeta, le ponemos uno por defecto
          if [ ! -f "/tmp/chiquios-rootfs/etc/hostname" ]; then
            echo "chiquiOS-${{ matrix.edition }}-${{ matrix.name_suffix }}" | sudo tee /tmp/chiquios-rootfs/etc/hostname
          fi

      - name: 🍃 Slim Down & Network On-Demand Tuning
        run: |
          sudo chroot /tmp/chiquios-rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            
            # Red y servicios pesados desactivados de base
            systemctl disable NetworkManager.service networking.service wpa_supplicant.service bluetooth.service cups.service avahi-daemon.service ModemManager.service || true
            systemctl mask systemd-networkd-wait-online.service NetworkManager-wait-online.service || true

            # Limpiar cachés y logs
            apt-get clean
            apt-get autoclean
            rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          "

      - name: 💿 Build Bootable ISO (${{ matrix.name_suffix }})
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          
          if [ "${{ matrix.deb_arch }}" = "arm64" ]; then
            # UEFI Puro para arm64
            EFI_IMG="/tmp/chiquios-rootfs/boot/grub/efiboot.img"
            sudo dd if=/dev/zero of=$EFI_IMG bs=1M count=8 status=none
            sudo mkfs.vfat $EFI_IMG >/dev/null
            
            sudo mkdir -p /tmp/efi_mount
            sudo mount -o loop $EFI_IMG /tmp/efi_mount
            sudo mkdir -p /tmp/efi_mount/EFI/BOOT
            sudo cp /tmp/chiquios-rootfs/EFI/BOOT/BOOTAA64.EFI /tmp/efi_mount/EFI/BOOT/BOOTAA64.EFI 2>/dev/null || true
            sudo cp /tmp/chiquios-rootfs/boot/grub/grub.cfg /tmp/efi_mount/EFI/BOOT/grub.cfg 2>/dev/null || true
            sudo umount /tmp/efi_mount

            sudo xorriso -as mkisofs -iso-level 3 \
              -o $GITHUB_WORKSPACE/dist/chiquiOS-${{ matrix.edition }}-${{ matrix.name_suffix }}.iso \
              -full-iso9660-filenames -volid "CHIQUIOS" \
              -eltorito-alt-boot \
              -e boot/grub/efiboot.img -no-emul-boot \
              -isohybrid-gpt-basdat \
              /tmp/chiquios-rootfs/
          else
            # Construcción con grub-mkrescue para x86 (x32 / x64)
            sudo grub-mkrescue -o $GITHUB_WORKSPACE/dist/chiquiOS-${{ matrix.edition }}-${{ matrix.name_suffix }}.iso /tmp/chiquios-rootfs/
          fi

      - name: 🖥️ Automated Boot Test (Solo x86 - 5 Minutos)
        if: matrix.deb_arch != 'arm64'
        run: |
          mkdir -p $GITHUB_WORKSPACE/test-logs
          
          QEMU_CMD="qemu-system-x86_64"
          EXTRA_ARGS=""
          
          if [ "${{ matrix.deb_arch }}" = "i386" ]; then
            QEMU_CMD="qemu-system-i386"
          else
            if [ -f /usr/share/ovmf/OVMF.fd ]; then
              EXTRA_ARGS="-bios /usr/share/ovmf/OVMF.fd"
            fi
          fi
          
          $QEMU_CMD $EXTRA_ARGS \
            -m 512M \
            -cdrom dist/chiquiOS-${{ matrix.edition }}-${{ matrix.name_suffix }}.iso \
            -boot d \
            -nographic \
            -no-reboot \
            > $GITHUB_WORKSPACE/test-logs/boot-output.txt 2>&1 &
          
          QEMU_PID=$!
          sleep 300
          kill $QEMU_PID || true
          
          echo "=== LOG DE LA PANTALLA VIRTUAL (BOOT TEST X86 - 5 MINS) ==="
          cat $GITHUB_WORKSPACE/test-logs/boot-output.txt

      - name: 📦 Upload ISO Artifact & Logs
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-${{ matrix.name_suffix }}
          path: dist/*.iso
