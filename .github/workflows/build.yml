name: Build ChiquiOS Core
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build ChiquiOS (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            iso_name: chiquiOS-core-x64.iso
          - arch: i386
            iso_name: chiquiOS-core-x32.iso
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debian-archive-keyring \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-ia32-bin
      - name: Show live-build version
        run: lb --version
      - name: Configure ChiquiOS
        run: |
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures "${{ matrix.arch }}" \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --debian-installer false \
            --apt-recommends false \
            --iso-volume "CHIQUIOS"
      - name: Configure GRUB
        run: |
          mkdir -p config/bootloaders
          printf '%s\n' grub-pc grub-efi > config/bootloaders.list
      - name: Configure package list
        run: |
          mkdir -p config/package-lists
          cat > config/package-lists/core.list.chroot <<'EOF'
          sudo
          ca-certificates
          network-manager
          iproute2
          iputils-ping
          nano
          less
          curl
          wget
          git
          xz-utils
          EOF
      - name: Build ISO
        run: |
          sudo lb build
      - name: Find and rename ISO
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "ERROR: live-build no generó ninguna ISO."
            exit 1
          fi
          mv "$ISO" "${{ matrix.iso_name }}"
          ls -lh "${{ matrix.iso_name }}"
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-core-${{ matrix.arch }}
          path: ${{ matrix.iso_name }}
          if-no-files-found: error
          retention-days: 14