name: Build ChiquiOS Core
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build ChiquiOS (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            iso_name: chiquiOS-core-x64.iso
          - arch: i386
            iso_name: chiquiOS-core-x32.iso
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debian-archive-keyring \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-ia32-bin
      - name: Configure ChiquiOS
        run: |
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures "${{ matrix.arch }}" \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --debian-installer false \
            --bootloaders "grub-efi grub-pc" \
            --apt-recommends false \
            --iso-volume "CHIQUIOS"
      - name: Configure package list
        run: |
          mkdir -p config/package-lists
          cat > config/package-lists/core.list.chroot <<'EOF'
          sudo
          ca-certificates
          network-manager
          iproute2
          iputils-ping
          nano
          less
          curl
          wget
          git
          xz-utils
          EOF
      - name: Build ISO
        run: |
          sudo lb build
      - name: Name ISO
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          mv "$ISO" "${{ matrix.iso_name }}"
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-core-${{ matrix.arch }}
          path: ${{ matrix.iso_name }}
          if-no-files-found: error
          retention-days: 14