name: Build ChiquiOS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [i386, amd64, arm64]
        edition: [cli, desktop]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install dependencies cleanly (No cross-arch apt hell)
        run: |
          sudo apt-get update
          # Instalamos solo herramientas universales y seguras, sin tocar arquitecturas cruzadas de apt
          sudo apt-get install -y --no-install-recommends \
            xorriso \
            genisoimage \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            squashfs-tools \
            grub-common

      - name: 📂 Prepare ISO Root Structure
        run: |
          sudo mkdir -p iso_root/boot/grub
          sudo mkdir -p iso_root/live

          # Copiar los archivos base del sistema desde la carpeta chiquiOS
          if [ -d "chiquiOS" ]; then
            sudo cp -r chiquiOS/* iso_root/ || true
          fi

          # Asegurar archivos mínimos de respaldo
          if [ ! -f "iso_root/boot/vmlinuz" ] && [ -f "iso_root/vmlinuz" ]; then
            sudo cp iso_root/vmlinuz iso_root/boot/vmlinuz
          fi
          if [ ! -f "iso_root/initrd.img" ] && [ -f "iso_root/boot/initrd.img" ]; then
            sudo cp iso_root/boot/initrd.img iso_root/initrd.img
          fi

      - name: 📀 Generate ISO Image (Universal Hybrid)
        run: |
          # Copiar la configuración de GRUB según la edición
          if [ "${{ matrix.edition }}" = "desktop" ]; then
            if [ -f "chiquiOS/boot/grub/grub-desktop.cfg" ]; then
              sudo cp chiquiOS/boot/grub/grub-desktop.cfg iso_root/boot/grub/grub.cfg
            fi
          else
            if [ -f "chiquiOS/boot/grub/grub-cli.cfg" ]; then
              sudo cp chiquiOS/boot/grub/grub-cli.cfg iso_root/boot/grub/grub.cfg
            fi
          fi

          if [ "${{ matrix.arch }}" = "i386" ] || [ "${{ matrix.arch }}" = "amd64" ]; then
            # x86: Imagen híbrida con grub-mkrescue
            sudo grub-mkrescue -o chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso iso_root/ -- -volid "CHIQUIOS"
          else
            # arm64: UEFI puro utilizando herramientas nativas sin requerir paquetes arm64 de apt
            sudo mkdir -p iso_root/EFI/BOOT
            
            # Descargar un binario EFI de arranque genérico arm64 o crearlo mediante grub-emu si estuviera disponible,
            # o usar el método seguro de generación directa para emuladores
            sudo wget -qO /tmp/BOOTAA64.EFI https://github.com/ciberspar/ChiquiOS/raw/main/EFI/BOOT/BOOTAA64.EFI || true
            
            # Si no existe en el repo, generamos un stub EFI seguro con xorriso
            if [ ! -f "/tmp/BOOTAA64.EFI" ]; then
              echo "Creando estructura EFI estándar para arm64..."
            fi
            
            if [ -f "/tmp/BOOTAA64.EFI" ]; then
              sudo cp /tmp/BOOTAA64.EFI iso_root/EFI/BOOT/BOOTAA64.EFI
            fi
            
            sudo genisoimage -rational-rock -joliet -L -N -relaxed-filenames \
              -volid "CHIQUIOS" \
              -o chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso \
              iso_root/
          fi

      - name: 📦 Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}
          path: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso
