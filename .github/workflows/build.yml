name: Build ChiquiOS with Debian Live

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ChiquiOS (${{ matrix.edition }} - ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm64, ppc64el]
        edition: [desktop, cli]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU and Binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Install Debian Live Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build live-boot live-config debootstrap qemu-user-static binfmt-support xorriso mtools dosfstools grub-common grub-pc-bin debian-archive-keyring

      - name: Fix Live-Build Contents 404 Bug
        run: |
          # Parcheamos el script de live-build que busca los archivos Contents-*.gz obsoletos
          sudo sed -i 's/wget.*Contents-.*//g' /usr/lib/live/build/chroot_linux-image || true
          sudo sed -i 's/.*Contents-.*//g' /usr/lib/live/build/chroot_linux-image || true

      - name: Setup Package Lists per Edition
        run: |
          mkdir -p config/package-lists
          rm -f config/package-lists/*.list.chroot

          KERNEL_PKG="linux-image-amd64"
          if [ "${{ matrix.arch }}" = "i386" ]; then
            KERNEL_PKG="linux-image-686"
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            KERNEL_PKG="linux-image-arm64"
          elif [ "${{ matrix.arch }}" = "ppc64el" ]; then
            KERNEL_PKG="linux-image-powerpc64le"
          fi

          if [ "${{ matrix.edition }}" = "cli" ]; then
            echo "Escribiendo paquetes CLI..."
            cat << EOF > config/package-lists/chiquios-cli.list.chroot
          $KERNEL_PKG
          systemd-sysv
          live-boot
          live-config
          nano
          curl
          wget
          git
          python3
          netcat-openbsd
          nmap
          EOF
          else
            echo "Escribiendo paquetes Desktop..."
            cat << EOF > config/package-lists/chiquios-desktop.list.chroot
          $KERNEL_PKG
          systemd-sysv
          live-boot
          live-config
          task-desktop
          lightdm
          plymouth
          plymouth-themes
          nano
          curl
          wget
          git
          python3
          EOF
          fi

      - name: Configure Debian Live
        run: |
          TARGET_ARCH="${{ matrix.arch }}"
          MIRROR_URL="http://ftp.debian.org/debian/"

          BOOTLOADER="isolinux"
          FLAVOUR="amd64"
          if [ "$TARGET_ARCH" = "i386" ]; then
            FLAVOUR="686"
          elif [ "$TARGET_ARCH" = "arm64" ]; then
            BOOTLOADER="grub-efi"
            FLAVOUR="arm64"
          elif [ "$TARGET_ARCH" = "ppc64el" ]; then
            BOOTLOADER="grub-efi"
            FLAVOUR="powerpc64le"
          fi

          BOOT_PARAMS="boot=live"
          if [ "${{ matrix.edition }}" = "desktop" ]; then
            BOOT_PARAMS="boot=live quiet splash plymouth.ignore-serial-consoles vt.global_cursor_default=0 logo.nologo"
          fi

          lb clean --purge || true

          lb config \
            --mode debian \
            --architectures "$TARGET_ARCH" \
            --distribution stable \
            --security false \
            --updates false \
            --backports false \
            --linux-packages "linux-image" \
            --linux-flavours "$FLAVOUR" \
            --mirror-bootstrap "$MIRROR_URL" \
            --mirror-chroot "$MIRROR_URL" \
            --mirror-binary "$MIRROR_URL" \
            --binary-images iso-hybrid \
            --apt-recommends false \
            --bootloader "$BOOTLOADER" \
            --bootappend-live "$BOOT_PARAMS"

      - name: Build ISO with Debian Live
        run: |
          sudo lb build

      - name: Collect ISO Artifacts
        run: |
          mkdir -p output_isos
          mv live-image-*.hybrid.iso output_isos/chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso || cp live-image-*.iso output_isos/chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso || true

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}
          path: output_isos/*.iso
