name: Build ChiquiOS (Live-Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ChiquiOS (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm64, ppc64el]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso mtools dosfstools qemu-user-static binfmt-support

      - name: Configure Live-Build
        run: |
          lb config \
            --architectures ${{ matrix.arch }} \
            --distribution stable \
            --binary-images iso-hybrid \
            --apt-recommends false \
            --bootloader isolinux

      - name: Build ISO
        run: |
          sudo lb build

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.arch }}
          path: live-image-${{ matrix.arch }}.hybrid.iso
