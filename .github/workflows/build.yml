
name: ChiquiOS Multilanguage Build

on:
  push:
    branches:
      - main
      - pruebas
  pull_request:
    branches:
      - main
      - pruebas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        arch:
          - i386
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            g++ \
            binutils \
            nasm \
            make \
            python3

      - name: Show toolchain versions
        run: |
          gcc --version
          g++ --version
          nasm -v
          make --version
          python3 --version

      - name: Clean
        run: make clean

      - name: Compile kernel
        run: make ARCH=${{ matrix.arch }}

      - name: Validate build
        run: make ARCH=${{ matrix.arch }} check

      - name: Verify ELF architecture and symbols
        run: |
          python3 tools/verify_elf.py \
            build/${{ matrix.arch }}/kernel.elf \
            ${{ matrix.arch }}

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChiquiOS-${{ matrix.arch }}-kernel
          path: |
            build/${{ matrix.arch }}/kernel.elf
            build/${{ matrix.arch }}/kernel.bin
          if-no-files-found: error
