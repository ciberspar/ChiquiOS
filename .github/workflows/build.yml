name: Build ChiquiOS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [i386, amd64]
        edition: [cli, desktop]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            genisoimage \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            xorriso \
            squashfs-tools \
            debootstrap

      - name: 📂 Prepare ISO Root Structure
        run: |
          sudo mkdir -p iso_root/boot/grub
          sudo mkdir -p iso_root/live

          # Simular o copiar los archivos base del sistema (kernel e initrd de prueba si no están armados)
          # Si tu pipeline ya genera vmlinuz e initrd.img en chiquiOS/boot/ o live/, se copiarán solos.
          if [ -d "chiquiOS" ]; then
            sudo cp -r chiquiOS/* iso_root/ || true
          fi

          # Asegurar que existan archivos mínimos para que no rompa el build si estás probando
          if [ ! -f "iso_root/boot/vmlinuz" ] && [ -f "iso_root/vmlinuz" ]; then
            sudo cp iso_root/vmlinuz iso_root/boot/vmlinuz
          fi
          if [ ! -f "iso_root/initrd.img" ] && [ -f "iso_root/boot/initrd.img" ]; then
            sudo cp iso_root/boot/initrd.img iso_root/initrd.img
          fi

      - name: 📀 Generate ISO Image with Embedded Config
        run: |
          # Copiar la configuración correcta de GRUB desde la ruta real del repo
          if [ "${{ matrix.edition }}" = "desktop" ]; then
            if [ -f "chiquiOS/boot/grub/grub-desktop.cfg" ]; then
              sudo cp chiquiOS/boot/grub/grub-desktop.cfg iso_root/boot/grub/grub.cfg
            fi
          else
            if [ -f "chiquiOS/boot/grub/grub-cli.cfg" ]; then
              sudo cp chiquiOS/boot/grub/grub-cli.cfg iso_root/boot/grub/grub.cfg
            fi
          fi

          # Generar la ISO híbrida booteable con grub-mkrescue
          sudo grub-mkrescue -o chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso iso_root/ -- -volid "CHIQUIOS"

      - name: 📦 Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}
          path: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso
