name: Build ChiquiOS (Robust Mirrors)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ChiquiOS (${{ matrix.edition }} - ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm64, ppc64el]
        edition: [desktop, cli]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU and Binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Install Build Tools & Keyrings
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap qemu-user-static binfmt-support xorriso mtools dosfstools grub-common grub-pc-bin debian-archive-keyring

      - name: Prepare Edition Package Lists
        run: |
          mkdir -p config/package-lists
          if [ "${{ matrix.edition }}" = "cli" ]; then
            echo "Escribiendo paquetes para CLI..."
            printf "systemd-sysv\nlinux-image-generic\nlive-boot\nlive-config\nnano\ncurl\nwget\ngit\npython3\nnetcat-openbsd\nnmap\n" > config/package-lists/chiquios.list.chroot
          fi

      - name: Configure Live-Build
        run: |
          TARGET_ARCH="${{ matrix.arch }}"
          HOST_ARCH=$(dpkg --print-architecture)
          
          EXTRA_FLAGS=""
          # Usar el mirror de respaldo oficial que nunca falla en CI
          MIRROR_URL="http://ftp.debian.org/debian/"

          if [ "$TARGET_ARCH" != "$HOST_ARCH" ]; then
            QEMU_ARCH="$TARGET_ARCH"
            if [ "$TARGET_ARCH" = "ppc64el" ]; then QEMU_ARCH="ppc64le"; fi
            EXTRA_FLAGS="--debootstrap-options --executable=qemu-${QEMU_ARCH}-static"
          fi

          BOOTLOADER="isolinux"
          if [ "$TARGET_ARCH" = "ppc64el" ] || [ "$TARGET_ARCH" = "arm64" ]; then
            BOOTLOADER="grub-efi"
          fi

          BOOT_PARAMS="boot=live"
          if [ "${{ matrix.edition }}" = "desktop" ]; then
            BOOT_PARAMS="boot=live quiet splash plymouth.ignore-serial-consoles vt.global_cursor_default=0 logo.nologo"
          fi

          lb config \
            --mode debian \
            --architectures "$TARGET_ARCH" \
            --distribution stable \
            --parent-mirror-bootstrap "$MIRROR_URL" \
            --parent-mirror-chroot "$MIRROR_URL" \
            --parent-mirror-binary "$MIRROR_URL" \
            --mirror-bootstrap "$MIRROR_URL" \
            --mirror-chroot "$MIRROR_URL" \
            --mirror-binary "$MIRROR_URL" \
            --binary-images iso-hybrid \
            --apt-recommends false \
            --bootloader "$BOOTLOADER" \
            --bootappend-live "$BOOT_PARAMS" \
            $EXTRA_FLAGS

      - name: Build ISO
        run: |
          sudo lb build

      - name: Rename and Prepare ISO Artifact
        run: |
          mkdir -p output_isos
          mv live-image-*.hybrid.iso output_isos/chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso || cp live-image-*.iso output_isos/chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso || true

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}
          path: output_isos/*.iso
