name: Build chiquiOS ISOs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition: [cli, desktop]
        arch: [amd64, arm64, i386]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools genisoimage grub-pc-bin grub-efi-amd64-bin mtools dosfstools curl

      - name: 🐧 Bootstrap Debian Rootfs
        run: |
          sudo debootstrap --variant=minbase bookworm /tmp/chiquios-rootfs http://deb.debian.org/debian/

      - name: 📁 Inject chiquiOS Custom Tree, Bacusp & Proper GRUB
        run: |
          sudo mkdir -p /tmp/chiquios-rootfs/usr/local/bin /tmp/chiquios-rootfs/etc/bacusp /tmp/chiquios-rootfs/boot/grub
          sudo curl -sSL "https://raw.githubusercontent.com/ciberspar/bacus-pkg/main/bin/bacusp" -o /tmp/chiquios-rootfs/usr/local/bin/bacusp
          sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/bacusp

          if [ -d "chiquiOS" ]; then
            sudo cp -r chiquiOS/* /tmp/chiquios-rootfs/ 2>/dev/null || true
          fi

          # Inyectar el GRUB correcto según la edición
          if [ "${{ matrix.edition }}" = "desktop" ]; then
            if [ -f "configs/grub-desktop.cfg" ]; then
              sudo cp configs/grub-desktop.cfg /tmp/chiquios-rootfs/boot/grub/grub.cfg
            fi
          else
            if [ -f "configs/grub-cli.cfg" ]; then
              sudo cp configs/grub-cli.cfg /tmp/chiquios-rootfs/boot/grub/grub.cfg
            fi
          fi

          if [ -d "/tmp/chiquios-rootfs/usr/local/bin" ]; then
            sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/* 2>/dev/null || true
          fi

          if [ ! -f "/tmp/chiquios-rootfs/etc/hostname" ]; then
            echo "chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}" | sudo tee /tmp/chiquios-rootfs/etc/hostname
          fi

      - name: 📦 Compress Rootfs to SquashFS
        run: |
          sudo mkdir -p iso_root/live
          sudo mksquashfs /tmp/chiquios-rootfs iso_root/live/filesystem.squashfs -comp xz

      - name: 💿 Copy Kernel and Initrd
        run: |
          sudo cp /tmp/chiquios-rootfs/boot/vmlinuz-* iso_root/vmlinuz
          sudo cp /tmp/chiquios-rootfs/boot/initrd.img-* iso_root/initrd.img
          sudo mkdir -p iso_root/boot
          sudo cp iso_root/vmlinuz iso_root/boot/vmlinuz
          sudo cp iso_root/initrd.img iso_root/boot/initrd.img

      - name: 📀 Generate ISO Image
        run: |
          sudo mkdir -p iso_root/boot/grub
          if [ -f "/tmp/chiquios-rootfs/boot/grub/grub.cfg" ]; then
            sudo cp /tmp/chiquios-rootfs/boot/grub/grub.cfg iso_root/boot/grub/grub.cfg
          fi

          sudo genisoimage -rational-rock -joliet -volid "CHIQUIOS" -b boot/grub/i386-pc/eltorito.img -c boot/grub/boot.catalog -no-emul-boot -boot-load-size 4 -boot-info-table -o chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso iso_root/ || \
          sudo genisoimage -rational-rock -joliet -volid "CHIQUIOS" -o chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso iso_root/

      - name: 🚀 Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}-iso
          path: chiquiOS-*.iso
