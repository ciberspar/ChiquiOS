name: Build ChiquiOS

on:
  push:
    branches:
      - main
      - pruebas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChiquiOS i386 BIOS
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc binutils make qemu-system-x86

      - name: Limpiar compilación anterior
        run: make clean

      - name: Compilar ChiquiOS
        run: make

      - name: Comprobar imagen
        run: make check

      - name: Verificar arquitectura del kernel
        run: |
          readelf -h build/kernel.elf
          readelf -h build/kernel.elf | grep -q "ELF32"
          readelf -h build/kernel.elf | grep -q "Intel 80386"
          nm build/kernel.elf | grep -q " T _start"
          nm build/kernel.elf | grep -q " T kernel_main"

      - name: Comprobar arranque BIOS con QEMU
        timeout-minutes: 1
        run: |
          timeout 20s qemu-system-i386 \
            -machine pc \
            -m 128M \
            -drive format=raw,file=build/chiquios.img \
            -boot c \
            -display none \
            -serial none \
            -monitor none \
            -no-reboot \
            -no-shutdown || test $? -eq 124

      - name: Publicar imagen
        uses: actions/upload-artifact@v4
        with:
          name: ChiquiOS-i386-BIOS
          path: build/chiquios.img
          if-no-files-found: error