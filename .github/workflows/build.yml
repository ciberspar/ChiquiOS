
name: Build ChiquiOS 0.5 ISO

on:
  push:
    branches:
      - main
      - pruebas
  workflow_dispatch:
    inputs:
      import_real_drivers:
        description: "Descargar fuentes externas de controladores"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ChiquiOS x86 BIOS
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            gcc \
            binutils \
            make \
            xorriso \
            file \
            git

      - name: Download external driver sources
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.import_real_drivers }}
        continue-on-error: true
        run: |
          if [ -f tools/import-drivers.sh ]; then
            bash tools/import-drivers.sh
          else
            echo "Import script not found; skipping."
          fi

      - name: Clean previous build
        run: make clean

      - name: Compile ChiquiOS own kernel and bootloader
        run: make

      - name: Check kernel and disk image
        run: make check

      - name: Build CD/DVD ISO without floppy emulation
        run: make iso

      - name: Verify generated images
        run: |
          set -eu
          test -s build/chiquios.img
          test -s build/chiquios.iso
          test -s build/boot_cd.bin
          test -s build/iso/boot.img
          file build/chiquios.img
          file build/chiquios.iso
          ls -lh \
            build/chiquios.img \
            build/chiquios.iso

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: ChiquiOS-0.5-Disk
          path: build/chiquios.img
          if-no-files-found: error

      - name: Upload bootable CD/DVD ISO
        uses: actions/upload-artifact@v4
        with:
          name: ChiquiOS-0.5-ISO
          path: build/chiquios.iso
          if-no-files-found: error
