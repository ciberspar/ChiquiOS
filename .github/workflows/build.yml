name: Build ChiquiOS Core
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build ChiquiOS (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            iso_name: chiquiOS-core-x64.iso
          - arch: i386
            iso_name: chiquiOS-core-x32.iso
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            ca-certificates \
            curl \
            gnupg \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-ia32-bin
          echo "=== Tool versions ==="
          lb --version
          debootstrap --version
          dpkg-query -W debian-archive-keyring
      - name: Download and verify Bookworm signing key
        shell: bash
        run: |
          set -euo pipefail
          KEY_URL="https://ftp-master.debian.org/keys/archive-key-12.asc"
          KEY_ASC="$RUNNER_TEMP/bookworm-archive-key.asc"
          KEYRING="$RUNNER_TEMP/bookworm-keyring.gpg"
          EXPECTED="4D64FEC119C2029067D6E791F8D2585B8783D481"
          curl --fail --silent --show-error --location \
            "$KEY_URL" -o "$KEY_ASC"
          ACTUAL="$(
            gpg --batch --show-keys --with-colons "$KEY_ASC" |
            awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          echo "Expected fingerprint: $EXPECTED"
          echo "Actual fingerprint:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Debian signing-key fingerprint mismatch."
            exit 1
          fi
          gpg --batch --yes --dearmor \
            --output "$KEYRING" "$KEY_ASC"
          echo "BOOKWORM_KEYRING=$KEYRING" >> "$GITHUB_ENV"
          echo "=== Verified Bookworm key ==="
          gpg --batch --show-keys "$KEYRING"
      - name: Configure ChiquiOS
        shell: bash
        run: |
          set -eux
          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures "${{ matrix.arch }}" \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --debian-installer none \
            --bootloaders "grub-pc grub-efi" \
            --keyring-packages debian-archive-keyring \
            --debootstrap-options "--keyring=${BOOKWORM_KEYRING}" \
            --apt-recommends false \
            --iso-application "ChiquiOS Core" \
            --iso-publisher "ChiquiOS" \
            --iso-volume "CHIQUIOS"
      - name: Configure package list
        shell: bash
        run: |
          set -eux
          mkdir -p config/package-lists
          cat > config/package-lists/core.list.chroot <<'EOF'
          sudo
          ca-certificates
          network-manager
          iproute2
          iputils-ping
          nano
          less
          curl
          wget
          git
          xz-utils
          EOF
      - name: Build ISO
        run: |
          set -eux
          sudo lb build
      - name: Find and rename ISO
        shell: bash
        run: |
          set -euo pipefail
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [ -z "$ISO" ]; then
            echo "ERROR: live-build did not generate an ISO."
            find . -maxdepth 2 -type f -print | sort | head -200
            exit 1
          fi
          mv "$ISO" "${{ matrix.iso_name }}"
          file "${{ matrix.iso_name }}"
          ls -lh "${{ matrix.iso_name }}"
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-core-${{ matrix.arch }}
          path: ${{ matrix.iso_name }}
          if-no-files-found: error
          retention-days: 14