
name: Build ChiquiOS Core

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChiquiOS (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            iso_name: chiquiOS-core-x64.iso
          - arch: i386
            iso_name: chiquiOS-core-x32.iso

    steps:
      - name: Install build tools
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            live-build \
            debootstrap \
            debian-archive-keyring \
            ca-certificates \
            curl \
            wget \
            xz-utils \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-ia32-bin \
            syslinux \
            syslinux-common

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show versions
        run: |
          lb --version
          debootstrap --version

      - name: Configure ChiquiOS
        run: |
          set -eux

          lb clean --purge || true
          rm -rf config

          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures "${{ matrix.arch }}" \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --debian-installer none \
            --keyring-packages debian-archive-keyring \
            --apt-recommends false \
            --apt-secure true \
            --iso-application "ChiquiOS Core" \
            --iso-publisher "ChiquiOS" \
            --iso-volume "CHIQUIOS"

      - name: Configure core packages
        run: |
          set -eux
          mkdir -p config/package-lists

          cat > config/package-lists/core.list.chroot <<'EOF'
          sudo
          ca-certificates
          network-manager
          iproute2
          iputils-ping
          nano
          less
          curl
          wget
          git
          xz-utils
          EOF

      - name: Build ISO
        run: |
          set -eux
          lb build

      - name: Find and rename ISO
        shell: bash
        run: |
          set -euo pipefail

          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"

          if [ -z "$ISO" ]; then
            echo "ERROR: No se generó ninguna ISO."
            exit 1
          fi

          mv "$ISO" "${{ matrix.iso_name }}"
          ls -lh "${{ matrix.iso_name }}"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-core-${{ matrix.arch }}
          path: ${{ matrix.iso_name }}
          if-no-files-found: error
          retention-days: 14
