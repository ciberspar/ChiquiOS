
name: Build ChiquiOS 0.4 ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ChiquiOS x86 BIOS
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            gcc \
            binutils \
            make \
            xorriso \
            file

      - name: Clean previous build
        run: make clean

      - name: Compile ChiquiOS
        run: make

      - name: Check kernel and disk image
        run: make check

      - name: Build CD/DVD ISO without floppy emulation
        run: make iso

      - name: Verify generated images
        run: |
          test -f build/chiquios.img
          test -f build/chiquios.iso
          test -f build/boot_cd.bin
          test -f build/iso/boot.img
          file build/chiquios.img
          file build/chiquios.iso
          ls -lh build/chiquios.img build/chiquios.iso

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: ChiquiOS-0.4-Disk
          path: build/chiquios.img
          if-no-files-found: error

      - name: Upload bootable CD/DVD ISO
        uses: actions/upload-artifact@v4
        with:
          name: ChiquiOS-0.4-ISO
          path: build/chiquios.iso
          if-no-files-found: error
