name: Build ChiquiOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.edition }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [i386, arm64]
        edition: [cli, desktop]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU and Binfmt
        uses: docker/setup-qemu-action@v3

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            xorriso \
            mtools \
            dosfstools \
            grub-pc-bin \
            grub-efi-amd64-bin \
            qemu-user-static \
            binfmt-support \
            docker.io

      - name: Generate RootFS using Docker & Debian Base
        run: |
          docker pull debian:stable-slim
          CONTAINER_ID=$(docker create debian:stable-slim)
          mkdir -p rootfs
          docker export $CONTAINER_ID | tar -C rootfs -x
          docker rm $CONTAINER_ID

      - name: Configure Chroot and Install Packages
        run: |
          sudo cp /usr/bin/qemu-arm-static rootfs/usr/bin/ || true
          sudo cp /usr/bin/qemu-i386-static rootfs/usr/bin/ || true

          sudo mount --bind /dev rootfs/dev
          sudo mount --bind /proc rootfs/proc
          sudo mount --bind /sys rootfs/sys

          if [ "${{ matrix.edition }}" = "desktop" ]; then
            sudo chroot rootfs bash -c "apt-get update && apt-get install -y systemd sysvinit-core lightdm lxde-core || true"
          else
            sudo chroot rootfs bash -c "apt-get update && apt-get install -y systemd sysvinit-core nano curl || true"
          fi

          sudo chroot rootfs bash -c "apt-get clean"
          sudo umount rootfs/dev rootfs/proc rootfs/sys || true

      - name: Build Real-PC Bootable ISO (i386 / x86)
        if: matrix.arch == 'i386'
        run: |
          mkdir -p iso_root/boot/grub
          sudo cp -a rootfs/* iso_root/
          
          # Configurar GRUB compatible para PCs reales (BIOS + UEFI)
          cat << 'EOF' > iso_root/boot/grub/grub.cfg
          set timeout=5
          set default=0
          menuentry "ChiquiOS i386 (${{ matrix.edition }})" {
              linux /boot/vmlinuz root=/dev/sda1 ro quiet
              initrd /boot/initrd.img
          }
          EOF

          # Generar ISO híbrida apta para quemar en pendrive (Rufus/Ventoy) o PC real
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "CHIQUIOS_PC" \
            -output chiquiOS-${{ matrix.edition }}-i386.iso \
            iso_root/

      - name: Build UEFI Disk Image for ARM64 (Mobile/Emulators)
        if: matrix.arch == 'arm64'
        run: |
          echo "Construyendo imagen UEFI FAT optimizada para ARM64..."
          
          IMG_SIZE="250M"
          if [ "${{ matrix.edition }}" = "cli" ]; then
            IMG_SIZE="120M"
          }
          
          fallocate -l $IMG_SIZE chiquiOS-${{ matrix.edition }}-arm64.img
          mkfs.vfat -F 32 chiquiOS-${{ matrix.edition }}-arm64.img

          mmd -i chiquiOS-${{ matrix.edition }}-arm64.img ::EFI
          mmd -i chiquiOS-${{ matrix.edition }}-arm64.img ::EFI\BOOT

          sudo mkdir -p /tmp/efi_src
          if [ -d "EFI/BOOT" ]; then
            cp -r EFI/BOOT/* /tmp/efi_src/
          else
            sudo wget -qO /tmp/efi_src/BOOTAA64.EFI https://github.com/ciberspar/ChiquiOS/raw/main/EFI/BOOT/BOOTAA64.EFI || true
          fi

          if [ -f "/tmp/efi_src/BOOTAA64.EFI" ]; then
            mcopy -i chiquiOS-${{ matrix.edition }}-arm64.img /tmp/efi_src/BOOTAA64.EFI ::EFI\BOOT/BOOTAA64.EFI
          fi

          echo "fs0:\EFI\BOOT\BOOTAA64.EFI" > /tmp/startup.nsh
          mcopy -i chiquiOS-${{ matrix.edition }}-arm64.img /tmp/startup.nsh ::startup.nsh

          mv chiquiOS-${{ matrix.edition }}-arm64.img chiquiOS-${{ matrix.edition }}-arm64.iso

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}
          path: chiquiOS-${{ matrix.edition }}-${{ matrix.arch }}.iso
          compression-level: 6
