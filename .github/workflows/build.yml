name: Build ChiquiOS (Live-Build Final)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build ChiquiOS (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm64, ppc64el]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso mtools dosfstools qemu-user-static binfmt-support

      - name: Configure Live-Build with Plymouth & Quiet Boot
        run: |
          lb config \
            --architectures ${{ matrix.arch }} \
            --distribution stable \
            --binary-images iso-hybrid \
            --apt-recommends false \
            --bootloader isolinux \
            --bootappend-live "boot=live quiet splash plymouth.ignore-serial-consoles vt.global_cursor_default=0 logo.nologo"

      - name: Build ISO
        run: |
          sudo lb build

      - name: Rename and Prepare ISO Artifact
        run: |
          mv live-image-*.hybrid.iso chiquiOS-${{ matrix.arch }}.iso || mv live-image-*.iso chiquiOS-${{ matrix.arch }}.iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.arch }}
          path: "*.iso"
