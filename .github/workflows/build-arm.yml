name: 🍓 Build chiquiOS ARM64 (Native Runner)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-arm:
    name: ⚙️ Build chiquiOS (${{ matrix.edition }} - arm64)
    # Usamos el runner nativo ARM de GitHub
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        edition: [cli, desktop]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools genisoimage xorriso grub-efi-arm64 grub-efi-arm64-bin curl git

      - name: 🐧 Bootstrap Debian Base (arm64 Native)
        run: |
          sudo mkdir -p /tmp/chiquios-rootfs
          sudo debootstrap --arch=arm64 --variant=minbase bookworm /tmp/chiquios-rootfs http://deb.debian.org/debian/

      - name: 🎨 Install Desktop UI (Solo versión Desktop)
        if: matrix.edition == 'desktop'
        run: |
          sudo chroot /tmp/chiquios-rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              xorg lxde-core pcmanfm lxpanel openbox lightdm netsurf-gtk sudo curl ca-certificates
          "

      - name: 🐢 Inject Bacusp & Custom Overlay
        run: |
          sudo mkdir -p /tmp/chiquios-rootfs/usr/local/bin /tmp/chiquios-rootfs/etc/bacusp
          sudo curl -sSL "https://raw.githubusercontent.com/ciberspar/bacus-pkg/main/bin/bacusp" -o /tmp/chiquios-rootfs/usr/local/bin/bacusp
          sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/bacusp

          if [ -d "overlay" ]; then
            sudo cp -r overlay/* /tmp/chiquios-rootfs/ 2>/dev/null || true
          fi

          echo "chiquiOS-${{ matrix.edition }}-arm64" | sudo tee /tmp/chiquios-rootfs/etc/hostname

      - name: 🔌 Configure UEFI Bootloader (ARM64)
        run: |
          sudo chroot /tmp/chiquios-rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y linux-image-arm64 grub-efi-arm64
          "
          
          # Estructura UEFI requerida por UTM y hardware ARM
          sudo mkdir -p /tmp/chiquios-rootfs/EFI/BOOT
          sudo cp /tmp/chiquios-rootfs/usr/lib/grub/arm64-efi/monolithic/grubaa64.efi /tmp/chiquios-rootfs/EFI/BOOT/BOOTAA64.EFI 2>/dev/null || \
          sudo cp /tmp/chiquios-rootfs/boot/efi/EFI/boot/bootaa64.efi /tmp/chiquios-rootfs/EFI/BOOT/BOOTAA64.EFI 2>/dev/null || true

          # Configurar GRUB
          sudo mkdir -p /tmp/chiquios-rootfs/boot/grub
          echo 'set timeout=5' | sudo tee /tmp/chiquios-rootfs/boot/grub/grub.cfg
          echo 'set default=0' | sudo tee -a /tmp/chiquios-rootfs/boot/grub/grub.cfg
          echo 'menuentry "chiquiOS (${{ matrix.edition }})" {' | sudo tee -a /tmp/chiquios-rootfs/boot/grub/grub.cfg
          echo '    linux /boot/vmlinuz-* root=/dev/vda1 rw quiet splash' | sudo tee -a /tmp/chiquios-rootfs/boot/grub/grub.cfg
          echo '    initrd /boot/initrd.img-*' | sudo tee -a /tmp/chiquios-rootfs/boot/grub/grub.cfg
          echo '}' | sudo tee -a /tmp/chiquios-rootfs/boot/grub/grub.cfg

      - name: 💿 Build UEFI ISO (ARM64)
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          sudo xorriso -as mkisofs -iso-level 3 -o $GITHUB_WORKSPACE/dist/chiquiOS-${{ matrix.edition }}-arm64.iso \
            -full-iso9660-filenames -volid "CHIQUIOS" \
            -eltorito-alt-boot \
            -e EFI/BOOT/boot.img -no-emul-boot \
            /tmp/chiquios-rootfs/ 2>/dev/null || \
          sudo genisoimage -J -R -V "CHIQUIOS" -o $GITHUB_WORKSPACE/dist/chiquiOS-${{ matrix.edition }}-arm64.iso /tmp/chiquios-rootfs/

      - name: 🚀 Upload ARM64 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-arm64
          path: dist/*.iso
