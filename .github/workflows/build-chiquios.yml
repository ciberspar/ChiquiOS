name: 🍓 Build chiquiOS (Debian + PIXEL)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🛠️ Herramientas de Compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools genisoimage xorriso curl git

      - name: 🐧 Bootstrapping Debian Bookworm
        run: |
          sudo mkdir -p /tmp/chiquios-rootfs
          sudo debootstrap --arch=amd64 --variant=minbase bookworm /tmp/chiquios-rootfs http://deb.debian.org/debian/

      - name: 🎨 Inyectar Código del Repositorio y PIXEL
        run: |
          # Copiar scripts propios del repo al rootfs
          sudo cp -r overlay/* /tmp/chiquios-rootfs/ 2>/dev/null || true
          sudo cp scripts/install-pixel.sh /tmp/chiquios-rootfs/tmp/
          
          # Dar permisos de ejecución a los binarios
          sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/* 2>/dev/null || true
          
          # Ejecutar la instalación de PIXEL dentro de Debian
          sudo chroot /tmp/chiquios-rootfs /bin/bash /tmp/install-pixel.sh
          sudo rm /tmp/chiquios-rootfs/tmp/install-pixel.sh

      - name: 🐢 Inyectar Gestor Bacusp
        run: |
          sudo curl -sSL "https://raw.githubusercontent.com/ciberspar/bacus-pkg/main/bin/bacusp" -o /tmp/chiquios-rootfs/usr/local/bin/bacusp
          sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/bacusp
          echo "chiquiOS" | sudo tee /tmp/chiquios-rootfs/etc/hostname

      - name: 📦 Empaquetar
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          cd /tmp
          sudo tar -czvf $GITHUB_WORKSPACE/dist/chiquiOS-Debian-PIXEL-amd64.tar.gz chiquios-rootfs/

      - name: 🚀 Subir Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-Debian-PIXEL
          path: dist/*.tar.gz
