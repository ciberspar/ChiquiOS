name: 🍓 Build chiquiOS Multi-Arch (x64, x32, ARM64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-os:
    name: ⚙️ Compilando chiquiOS (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            deb_arch: amd64
            name_suffix: x64
          - arch: i386
            deb_arch: i386
            name_suffix: x32
          - arch: arm64
            deb_arch: arm64
            name_suffix: arm64

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install Build Tools & Emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools genisoimage xorriso curl git qemu-user-static binfmt-support

      - name: 🐧 Bootstrap Debian Base (${{ matrix.arch }})
        run: |
          echo "🌀 Creando entorno chiquiOS para ${{ matrix.arch }}..."
          sudo mkdir -p /tmp/chiquios-rootfs
          
          # Usamos debootstrap con soporte para distintas arquitecturas
          sudo debootstrap --arch=${{ matrix.deb_arch }} --variant=minbase bookworm /tmp/chiquios-rootfs http://deb.debian.org/debian/

      - name: 🐢 Inject Bacusp Engine into chiquiOS
        run: |
          sudo mkdir -p /tmp/chiquios-rootfs/usr/local/bin /tmp/chiquios-rootfs/etc/bacusp
          sudo curl -sSL "https://raw.githubusercontent.com/ciberspar/bacus-pkg/main/bin/bacusp" -o /tmp/chiquios-rootfs/usr/local/bin/bacusp
          sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/bacusp
          echo "chiquiOS-${{ matrix.name_suffix }}" | sudo tee /tmp/chiquios-rootfs/etc/hostname

      - name: 📦 Compress Rootfs for ${{ matrix.name_suffix }}
        run: |
          echo "🗜️ Empaquetando chiquiOS para ${{ matrix.name_suffix }}..."
          mkdir -p $GITHUB_WORKSPACE/dist
          cd /tmp
          sudo tar -czvf $GITHUB_WORKSPACE/dist/chiquiOS-${{ matrix.name_suffix }}-rootfs.tar.gz chiquios-rootfs/

      - name: 🚀 Upload Multi-Arch Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.name_suffix }}
          path: dist/*.tar.gz
