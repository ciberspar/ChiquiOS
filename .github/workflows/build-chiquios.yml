name: 🍓 Build chiquiOS (Matrix Multi-Arch ISO)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-matrix:
    name: ⚙️ Build ${{ matrix.edition }} (${{ matrix.name_suffix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- VERSIONES CLI ---
          - edition: cli
            deb_arch: amd64
            name_suffix: x64
          - edition: cli
            deb_arch: i386
            name_suffix: x32
          - edition: cli
            deb_arch: arm64
            name_suffix: arm64

          # --- VERSIONES DESKTOP (PIXEL) ---
          - edition: desktop
            deb_arch: amd64
            name_suffix: x64
          - edition: desktop
            deb_arch: i386
            name_suffix: x32
          - edition: desktop
            deb_arch: arm64
            name_suffix: arm64

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install Build Tools & Emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools genisoimage xorriso curl git qemu-user-static binfmt-support

      - name: 🐧 Bootstrap Debian Base (${{ matrix.deb_arch }})
        run: |
          sudo mkdir -p /tmp/chiquios-rootfs
          sudo debootstrap --arch=${{ matrix.deb_arch }} --variant=minbase bookworm /tmp/chiquios-rootfs http://deb.debian.org/debian/

      - name: 🎨 Install Desktop UI (Solo versión Desktop)
        if: matrix.edition == 'desktop'
        run: |
          sudo chroot /tmp/chiquios-rootfs /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              xorg lxde-core pcmanfm lxpanel openbox lightdm netsurf-gtk sudo curl ca-certificates
          "

      - name: 🐢 Inject Bacusp & Custom Overlay
        run: |
          sudo mkdir -p /tmp/chiquios-rootfs/usr/local/bin /tmp/chiquios-rootfs/etc/bacusp
          sudo curl -sSL "https://raw.githubusercontent.com/ciberspar/bacus-pkg/main/bin/bacusp" -o /tmp/chiquios-rootfs/usr/local/bin/bacusp
          sudo chmod +x /tmp/chiquios-rootfs/usr/local/bin/bacusp

          # Copiar archivos propios del repo si existe la carpeta overlay
          if [ -d "overlay" ]; then
            sudo cp -r overlay/* /tmp/chiquios-rootfs/ 2>/dev/null || true
          fi

          echo "chiquiOS-${{ matrix.edition }}-${{ matrix.name_suffix }}" | sudo tee /tmp/chiquios-rootfs/etc/hostname

      - name: 💿 Build Bootable ISO
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          sudo genisoimage -J -R -V "CHIQUIOS" \
            -o $GITHUB_WORKSPACE/dist/chiquiOS-${{ matrix.edition }}-${{ matrix.name_suffix }}.iso \
            /tmp/chiquios-rootfs/

      - name: 🚀 Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquiOS-${{ matrix.edition }}-${{ matrix.name_suffix }}
          path: dist/*.iso
