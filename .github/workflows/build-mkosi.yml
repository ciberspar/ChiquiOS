name: Build Alpine ChiquiOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Alpine ISO (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Alpine ISO Tools on Runner
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            alpine-make-iso \
            xorriso \
            syslinux-common \
            isolinux \
            squashfs-tools \
            dosfstools \
            mtools \
            genisoimage

      - name: Build Alpine Live ISO
        run: |
          # alpine-make-iso empaqueta el sistema base usando el bootloader nativo de Alpine
          sudo alpine-make-iso \
            --output chiquios-alpine-amd64.iso \
            --profile standard \
            --packages "nano curl wget htop python3 git" \
            --branch stable

      - name: Verify and Prepare Artifact
        run: |
          test -s chiquios-alpine-amd64.iso
          mkdir -p output_iso
          mv chiquios-alpine-amd64.iso output_iso/

      - name: Upload Alpine ISO
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-alpine-amd64
          path: output_iso/*.iso
          if-no-files-found: error
          retention-days: 14
