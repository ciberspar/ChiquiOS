
name: Build ChiquiOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "chiquios/**"
      - ".github/workflows/build-chiquios.yml"

permissions:
  contents: read

concurrency:
  group: chiquios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ChiquiOS ${{ matrix.edition }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: cli
            profile: chiquios_cli
            source: mkimg_chiquios-cli.sh

          - edition: desktop
            profile: chiquios_desktop
            source: mkimg_chiquios-desktop.sh

    steps:
      - name: Checkout ChiquiOS
        uses: actions/checkout@v4
        with:
          path: chiquios-repo

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Check Docker
        run: |
          docker --version
          docker info

      - name: Clone Alpine aports
        run: |
          git clone \
            --depth 1 \
            --branch 3.24-stable \
            https://github.com/alpinelinux/aports.git \
            aports

      - name: Clone Bacus-Pkg
        run: |
          git clone \
            --depth 1 \
            https://github.com/ciberspar/Bacus-pkg.git \
            bacus-pkg

          test -d bacus-pkg

      - name: Prepare ChiquiOS profiles
        env:
          PROFILE: ${{ matrix.profile }}
          PROFILE_SOURCE: ${{ matrix.source }}
        run: |
          set -eu

          test -f "chiquios-repo/chiquios/$PROFILE_SOURCE"
          test -f "chiquios-repo/chiquios/genapkovl-chiquios.sh"

          cp \
            "chiquios-repo/chiquios/$PROFILE_SOURCE" \
            "aports/scripts/mkimg.$PROFILE.sh"

          cp \
            "chiquios-repo/chiquios/genapkovl-chiquios.sh" \
            "aports/scripts/genapkovl-chiquios.sh"

          chmod +x "aports/scripts/mkimg.$PROFILE.sh"
          chmod +x "aports/scripts/genapkovl-chiquios.sh"

          echo "Profile preparado: $PROFILE"

      - name: Build ISO
        env:
          PROFILE: ${{ matrix.profile }}
          EDITION: ${{ matrix.edition }}
        run: |
          set -eu

          mkdir -p dist work

          docker run --rm \
            --privileged \
            -e PROFILE="$PROFILE" \
            -e EDITION="$EDITION" \
            -v "$PWD/aports:/aports" \
            -v "$PWD/bacus-pkg:/bacus-pkg:ro" \
            -v "$PWD/dist:/dist" \
            -v "$PWD/work:/work" \
            alpine:3.24 \
            sh -euxc '
              apk add --no-cache \
                alpine-conf \
                abuild \
                apk-tools \
                busybox \
                fakeroot \
                git \
                syslinux \
                xorriso \
                squashfs-tools \
                grub \
                mtools \
                sudo \
                coreutils \
                bash

              cd /aports/scripts

              echo "Corrigiendo compatibilidad con apk moderno..."

              if grep -n -- "--no-chown" ./mkimage.sh; then
                sed -i "s/--no-chown//g" ./mkimage.sh
              fi

              if grep -n -- "--no-chown" ./mkimage.sh; then
                echo "ERROR: sigue presente --no-chown"
                exit 1
              fi

              echo "Construyendo ChiquiOS: $EDITION"

              sh ./mkimage.sh \
                --tag v3.24 \
                --outdir /dist \
                --workdir /work \
                --arch x86 \
                --profile "$PROFILE" \
                --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/main \
                --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/community

              echo "Build finalizado."
            '

      - name: Verify generated ISO
        run: |
          set -eu

          if ! find dist -maxdepth 1 -type f -name '*.iso' -print -quit | grep -q .; then
            echo "ERROR: no se generó ningún archivo ISO."
            exit 1
          fi

          ls -lh dist/*.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-${{ matrix.edition }}-x86
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 14
