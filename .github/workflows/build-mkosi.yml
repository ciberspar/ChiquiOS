
name: Build ChiquiOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mkosi.conf"
      - ".github/workflows/build-mkosi.yml"

permissions:
  contents: read

concurrency:
  group: chiquios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x32:
    name: ChiquiOS x32 - Debian 12
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Descargar ChiquiOS
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-apt \
            debootstrap ca-certificates \
            debian-archive-keyring \
            grub-common grub-pc-bin grub2-common \
            grub-efi-ia32-bin xorriso \
            dosfstools e2fsprogs mtools \
            qemu-system-x86 ovmf

      - name: Descargar Mkosi
        run: |
          set -euxo pipefail
          git clone --depth 1 \
            https://github.com/systemd/mkosi.git \
            "$RUNNER_TEMP/mkosi"
          test -x "$RUNNER_TEMP/mkosi/bin/mkosi"
          echo "MKOSI_BIN=$RUNNER_TEMP/mkosi/bin/mkosi" \
            >> "$GITHUB_ENV"

      - name: Configurar imagen x32
        run: |
          set -euxo pipefail
          sed \
            -e 's/^Release=.*/Release=bookworm/' \
            -e 's/^Architecture=.*/Architecture=x86/' \
            -e 's/^Format=.*/Format=disk/' \
            -e 's/^Output=.*/Output=chiquios-x32/' \
            -e '/^\[Content\]/a BiosBootloader=grub' \
            mkosi.conf > "$RUNNER_TEMP/mkosi-x32.conf"

          mkdir -p "$RUNNER_TEMP/chiquios-x32"
          cp "$RUNNER_TEMP/mkosi-x32.conf" \
            "$RUNNER_TEMP/chiquios-x32/mkosi.conf"

      - name: Construir imagen x32
        working-directory: ${{ runner.temp }}/chiquios-x32
        run: |
          set -euxo pipefail
          sudo "$MKOSI_BIN" summary
          sudo "$MKOSI_BIN" --force build

      - name: Publicar artefactos x32
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-x32-bookworm
          path: ${{ runner.temp }}/chiquios-x32/mkosi.output/**
          if-no-files-found: warn
          retention-days: 14

  build-x64:
    name: ChiquiOS x64 - Debian 12
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Descargar ChiquiOS
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-apt \
            debootstrap ca-certificates \
            debian-archive-keyring \
            grub-common grub-pc-bin grub-efi-amd64-bin \
            grub2-common xorriso \
            dosfstools e2fsprogs mtools \
            qemu-system-x86 ovmf

      - name: Descargar Mkosi
        run: |
          set -euxo pipefail
          git clone --depth 1 \
            https://github.com/systemd/mkosi.git \
            "$RUNNER_TEMP/mkosi"
          test -x "$RUNNER_TEMP/mkosi/bin/mkosi"
          echo "MKOSI_BIN=$RUNNER_TEMP/mkosi/bin/mkosi" \
            >> "$GITHUB_ENV"

      - name: Configurar imagen x64
        run: |
          set -euxo pipefail
          sed \
            -e 's/^Release=.*/Release=bookworm/' \
            -e 's/^Architecture=.*/Architecture=x86-64/' \
            -e 's/^Format=.*/Format=disk/' \
            -e 's/^Output=.*/Output=chiquios-x64/' \
            -e '/^\[Content\]/a BiosBootloader=grub' \
            mkosi.conf > "$RUNNER_TEMP/mkosi-x64.conf"

          mkdir -p "$RUNNER_TEMP/chiquios-x64"
          cp "$RUNNER_TEMP/mkosi-x64.conf" \
            "$RUNNER_TEMP/chiquios-x64/mkosi.conf"

      - name: Construir imagen x64
        working-directory: ${{ runner.temp }}/chiquios-x64
        run: |
          set -euxo pipefail
          sudo "$MKOSI_BIN" summary
          sudo "$MKOSI_BIN" --force build

      - name: Publicar artefactos x64
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-x64-bookworm
          path: ${{ runner.temp }}/chiquios-x64/mkosi.output/**
          if-no-files-found: warn
          retention-days: 14
