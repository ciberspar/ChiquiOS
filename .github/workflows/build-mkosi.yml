name: Build ChiquiOS

on:
push:
branches: [main, master]
workflow_dispatch:

permissions:
contents: read

concurrency:
group: chiquios-${{ github.ref }}
cancel-in-progress: true

jobs:
validate:
name: Validate sources
runs-on: ubuntu-22.04
steps:
- name: Checkout ChiquiOS
uses: actions/checkout@v4
with:
path: chiquios-repo

  - name: Verify project files
    shell: bash
    run: |
      set -Eeuo pipefail
      for file in \
        chiquios-repo/chiquios/mkimg_chiquios-cli.sh \
        chiquios-repo/chiquios/mkimg_chiquios-desktop.sh \
        chiquios-repo/chiquios/genapkovl-chiquios.sh
      do
        if [[ ! -f "$file" ]]; then
          echo "::error::Missing file: $file"
          exit 1
        fi
        bash -n "$file"
      done

build:
name: Build ChiquiOS ${{ matrix.edition }} x86
needs: validate
runs-on: ubuntu-22.04
timeout-minutes: 180
strategy:
fail-fast: false
matrix:
include:
- edition: cli
profile: chiquios_cli
source: mkimg_chiquios-cli.sh
- edition: desktop
profile: chiquios_desktop
source: mkimg_chiquios-desktop.sh

steps:
  - name: Checkout ChiquiOS
    uses: actions/checkout@v4
    with:
      path: chiquios-repo
  - name: Checkout Bacus-Pkg
    uses: actions/checkout@v4
    with:
      repository: ciberspar/Bacus-pkg
      path: bacus-pkg
  - name: Checkout Alpine aports
    uses: actions/checkout@v4
    with:
      repository: alpinelinux/aports
      ref: 3.24-stable
      path: aports
  - name: Install build dependencies
    run: |
      set -Eeuo pipefail
      sudo apt-get update
      sudo apt-get install -y docker.io git file
      sudo systemctl start docker
      sudo docker version
  - name: Install ChiquiOS profile
    env:
      PROFILE: ${{ matrix.profile }}
      SOURCE: ${{ matrix.source }}
    shell: bash
    run: |
      set -Eeuo pipefail
      test -f "chiquios-repo/chiquios/$SOURCE"
      test -f chiquios-repo/chiquios/genapkovl-chiquios.sh
      test -f aports/scripts/mkimage.sh
      test -f aports/scripts/mkimg.base.sh
      install -m 755 "chiquios-repo/chiquios/$SOURCE" "aports/scripts/mkimg.$PROFILE.sh"
      install -m 755 chiquios-repo/chiquios/genapkovl-chiquios.sh aports/scripts/genapkovl-chiquios.sh
  - name: Build ISO
    env:
      PROFILE: ${{ matrix.profile }}
      EDITION: ${{ matrix.edition }}
    shell: bash
    run: |
      set -Eeuo pipefail
      mkdir -p dist work
      sudo docker run --rm \
        --privileged \
        -e PROFILE="$PROFILE" \
        -e EDITION="$EDITION" \
        -v "$PWD/aports:/aports" \
        -v "$PWD/bacus-pkg:/bacus-pkg:ro" \
        -v "$PWD/dist:/dist" \
        -v "$PWD/work:/work" \
        alpine:3.24 \
        sh -euxc '
          apk add --no-cache alpine-conf abuild apk-tools busybox fakeroot git syslinux xorriso squashfs-tools grub mtools sudo coreutils bash ca-certificates
          cd /aports/scripts
          test -f ./mkimage.sh
          test -f "./mkimg.${PROFILE}.sh"
          sed -i "s/--no-chown//g" ./mkimage.sh
          install -d -m 700 /root/.abuild
          abuild-keygen -a -i -n
          test -s /root/.abuild/abuild.conf
          ./mkimage.sh \
            --tag v3.24 \
            --outdir /dist \
            --workdir /work \
            --arch x86 \
            --profile "$PROFILE" \
            --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/main \
            --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/community
          find /dist -maxdepth 2 -type f -ls
        '
  - name: Verify ISO
    env:
      EDITION: ${{ matrix.edition }}
    shell: bash
    run: |
      set -Eeuo pipefail
      ISO="$(find dist -maxdepth 1 -type f -iname '*.iso' -print -quit)"
      if [[ -z "$ISO" ]]; then
        echo "::error::No ISO generated for $EDITION"
        find dist -maxdepth 3 -type f -print || true
        exit 1
      fi
      file "$ISO"
      ls -lh "$ISO"
      sha256sum "$ISO"
  - name: Upload ISO
    uses: actions/upload-artifact@v4
    with:
      name: chiquiOS-${{ matrix.edition }}-x86
      path: dist/*.iso
      if-no-files-found: error
      retention-days: 14