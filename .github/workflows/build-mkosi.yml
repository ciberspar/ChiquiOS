name: Build ChiquiOS

on:
push:
branches: [main, master]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build ChiquiOS ${{ matrix.edition }} x86
runs-on: ubuntu-22.04
timeout-minutes: 180

strategy:
  fail-fast: false
  matrix:
    include:
      - edition: cli
        profile: chiquios_cli
        script: mkimg_chiquios-cli.sh
      - edition: desktop
        profile: chiquios_desktop
        script: mkimg_chiquios-desktop.sh
steps:
  - name: Checkout ChiquiOS
    uses: actions/checkout@v4
  - name: Checkout Bacus-Pkg
    uses: actions/checkout@v4
    with:
      repository: ciberspar/Bacus-pkg
      path: bacus-pkg
  - name: Checkout Alpine aports
    uses: actions/checkout@v4
    with:
      repository: alpinelinux/aports
      ref: 3.24-stable
      path: aports
  - name: Validate files
    env:
      PROFILE_SCRIPT: ${{ matrix.script }}
    shell: bash
    run: |
      set -Eeuo pipefail
      echo "=== Raíz del repositorio ==="
      pwd
      ls -la
      ls -la chiquios || true
      test -f "chiquios/$PROFILE_SCRIPT" || {
        echo "::error::No existe chiquios/$PROFILE_SCRIPT"
        exit 1
      }
      test -f chiquios/genapkovl-chiquios.sh || {
        echo "::error::No existe chiquios/genapkovl-chiquios.sh"
        exit 1
      }
      test -f aports/scripts/mkimage.sh
      test -f aports/scripts/mkimg.base.sh
      bash -n "chiquios/$PROFILE_SCRIPT"
      bash -n chiquios/genapkovl-chiquios.sh
  - name: Install ChiquiOS profiles
    env:
      PROFILE: ${{ matrix.profile }}
      PROFILE_SCRIPT: ${{ matrix.script }}
    shell: bash
    run: |
      set -Eeuo pipefail
      install -m 755 \
        "chiquios/$PROFILE_SCRIPT" \
        "aports/scripts/mkimg.$PROFILE.sh"
      install -m 755 \
        chiquios/genapkovl-chiquios.sh \
        aports/scripts/genapkovl-chiquios.sh
  - name: Build ISO
    env:
      PROFILE: ${{ matrix.profile }}
      EDITION: ${{ matrix.edition }}
    shell: bash
    run: |
      set -Eeuo pipefail
      mkdir -p dist work
      sudo docker run --rm \
        --privileged \
        -e PROFILE="$PROFILE" \
        -e EDITION="$EDITION" \
        -v "$PWD/aports:/aports" \
        -v "$PWD/bacus-pkg:/bacus-pkg:ro" \
        -v "$PWD/dist:/dist" \
        -v "$PWD/work:/work" \
        alpine:3.24 \
        sh -euxc '
          apk add --no-cache \
            alpine-conf \
            abuild \
            apk-tools \
            busybox \
            fakeroot \
            git \
            syslinux \
            xorriso \
            squashfs-tools \
            grub \
            mtools \
            sudo \
            coreutils \
            bash \
            ca-certificates
          cd /aports/scripts
          sed -i "s/--no-chown//g" ./mkimage.sh
          install -d -m 700 /root/.abuild
          abuild-keygen -a -i -n
          test -s /root/.abuild/abuild.conf
          ./mkimage.sh \
            --tag v3.24 \
            --outdir /dist \
            --workdir /work \
            --arch x86 \
            --profile "$PROFILE" \
            --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/main \
            --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/community
          find /dist -maxdepth 2 -type f -ls
        '
  - name: Verify ISO
    env:
      EDITION: ${{ matrix.edition }}
    shell: bash
    run: |
      set -Eeuo pipefail
      ISO="$(find dist -maxdepth 1 -type f -iname '*.iso' -print -quit)"
      if [[ -z "$ISO" ]]; then
        echo "::error::No se generó la ISO de $EDITION"
        find dist -maxdepth 3 -type f -print || true
        exit 1
      fi
      file "$ISO"
      sha256sum "$ISO"
      ls -lh "$ISO"
  - name: Upload ISO
    uses: actions/upload-artifact@v4
    with:
      name: chiquiOS-${{ matrix.edition }}-x86
      path: dist/*.iso
      if-no-files-found: error
      retention-days: 14