
name: Build ChiquiOS x32

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-mkosi.yml"

permissions:
  contents: read

concurrency:
  group: chiquios-x32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x32:
    name: Alpine Stable x86
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Instalar herramientas
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates

      - name: Descargar ISO oficial de Alpine
        run: |
          set -euxo pipefail

          BASE="https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/x86"
          ISO="alpine-standard-3.24.3-x86.iso"

          mkdir -p dist
          curl -fL --retry 3 \
            "$BASE/$ISO" \
            -o "dist/$ISO"

          curl -fL --retry 3 \
            "$BASE/$ISO.sha256" \
            -o "dist/$ISO.sha256"

      - name: Verificar SHA-256
        run: |
          set -euxo pipefail
          cd dist
          sha256sum -c alpine-standard-3.24.3-x86.iso.sha256

      - name: Publicar ISO original verificada
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-x32-base-alpine-3.24.3
          path: dist/
          if-no-files-found: error
          retention-days: 7
