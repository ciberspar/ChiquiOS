
name: Build ChiquiOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "chiquios/**"
      - ".github/workflows/build-chiquios.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ChiquiOS ${{ matrix.edition }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: cli
            profile: chiquios_cli
            source: mkimg_chiquios-cli.sh

          - edition: desktop
            profile: chiquios_desktop
            source: mkimg_chiquios-desktop.sh

    steps:
      - name: Descargar ChiquiOS
        uses: actions/checkout@v4
        with:
          path: chiquios-repo

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y git docker.io

      - name: Descargar Bacus-Pkg
        run: |
          git clone --depth 1 \
            https://github.com/ciberspar/Bacus-pkg.git \
            bacus-pkg

      - name: Descargar aports
        run: |
          git clone --depth 1 \
            --branch 3.24-stable \
            https://github.com/alpinelinux/aports.git \
            aports

      - name: Preparar perfiles
        env:
          SOURCE: ${{ matrix.source }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -eu

          test -f "chiquios-repo/chiquios/$SOURCE"
          test -f "chiquios-repo/chiquios/genapkovl-chiquios.sh"

          cp "chiquios-repo/chiquios/$SOURCE" \
            "aports/scripts/mkimg.$PROFILE.sh"

          cp chiquios-repo/chiquios/genapkovl-chiquios.sh \
            aports/scripts/genapkovl-chiquios.sh

          chmod +x \
            "aports/scripts/mkimg.$PROFILE.sh" \
            aports/scripts/genapkovl-chiquios.sh

          case "$PROFILE" in
            chiquios_cli)
              grep -q '^profile_chiquios_cli()' \
                "aports/scripts/mkimg.$PROFILE.sh"
              ;;
            chiquios_desktop)
              grep -q '^profile_chiquios_desktop()' \
                "aports/scripts/mkimg.$PROFILE.sh"
              ;;
            *)
              echo "Perfil desconocido: $PROFILE"
              exit 1
              ;;
          esac

      - name: Crear directorios
        run: |
          mkdir -p dist work

      - name: Construir ISO de Alpine
        env:
          PROFILE: ${{ matrix.profile }}
          EDITION: ${{ matrix.edition }}
        run: |
          set -eu

          docker run --rm \
            -v "$PWD/aports:/aports" \
            -v "$PWD/bacus-pkg:/bacuspkg:ro" \
            -v "$PWD/dist:/dist" \
            -v "$PWD/work:/work" \
            -e BACUS_SOURCE=/bacuspkg \
            -e PROFILE="$PROFILE" \
            -e EDITION="$EDITION" \
            alpine:3.24 sh -ec '
              apk add --no-cache \
                alpine-conf \
                abuild \
                apk-tools \
                busybox \
                fakeroot \
                git \
                syslinux \
                xorriso \
                squashfs-tools \
                grub \
                mtools

              cd /aports/scripts

              sh ./mkimage.sh \
                --tag v3.24 \
                --outdir /dist \
                --workdir /work \
                --arch x86 \
                --profile "$PROFILE" \
                --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/main \
                --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/community
            '

      - name: Verificar ISO generada
        run: |
          set -eu

          if ! find dist -maxdepth 1 -type f -name '*.iso' \
            -print -quit | grep -q .; then
            echo "ERROR: no se generó ninguna ISO"
            exit 1
          fi

          find dist -maxdepth 1 -type f -name '*.iso' -ls

      - name: Publicar ISO
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-${{ matrix.edition }}-x86
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 7
