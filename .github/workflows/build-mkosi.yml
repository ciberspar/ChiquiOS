
name: Build ChiquiOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mkimg.*.sh"
      - "genapkovl-chiquios.sh"
      - ".github/workflows/build-chiquios.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ChiquiOS ${{ matrix.edition }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: cli
            profile: chiquios_cli
          - edition: pixel
            profile: chiquios_pixel

    steps:
      - name: Descargar ChiquiOS
        uses: actions/checkout@v4
        with:
          path: chiquios

      - name: Instalar herramientas de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            docker.io \
            ca-certificates

      - name: Descargar Bacus-Pkg
        run: |
          git clone \
            --depth 1 \
            https://github.com/ciberspar/Bacus-pkg.git \
            Bacus-pkg

      - name: Obtener aports de Alpine
        run: |
          git clone \
            --depth 1 \
            --branch 3.24-stable \
            https://github.com/alpinelinux/aports.git \
            aports

      - name: Preparar perfiles personalizados
        run: |
          set -eu

          cp chiquios/mkimg.chiquios-cli.sh \
            aports/scripts/mkimg.chiquios_cli.sh

          cp chiquios/mkimg.chiquios-pixel.sh \
            aports/scripts/mkimg.chiquios_pixel.sh

          cp chiquios/genapkovl-chiquios.sh \
            aports/scripts/genapkovl-chiquios.sh

          chmod +x \
            aports/scripts/mkimg.chiquios_cli.sh \
            aports/scripts/mkimg.chiquios_pixel.sh \
            aports/scripts/genapkovl-chiquios.sh

          grep -q '^profile_chiquios_cli()' \
            aports/scripts/mkimg.chiquios_cli.sh

          grep -q '^profile_chiquios_pixel()' \
            aports/scripts/mkimg.chiquios_pixel.sh

      - name: Construir ISO
        env:
          EDITION: ${{ matrix.edition }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -eu

          mkdir -p dist work

          docker run --rm \
            -v "$PWD/aports:/aports" \
            -v "$PWD/Bacus-pkg:/bacuspkg:ro" \
            -v "$PWD/dist:/dist" \
            -v "$PWD/work:/work" \
            -e BACUS_SOURCE=/bacuspkg \
            -e EDITION="$EDITION" \
            -e PROFILE="$PROFILE" \
            alpine:3.24 \
            sh -ec '
              apk add --no-cache \
                alpine-conf \
                abuild \
                apk-tools \
                busybox \
                fakeroot \
                git \
                syslinux \
                xorriso \
                squashfs-tools \
                grub \
                mtools

              cd /aports/scripts

              # Verificar que mkimage reconozca ambos perfiles.
              sh ./mkimage.sh --help

              # Construir solo el perfil solicitado.
              sh ./mkimage.sh \
                --tag v3.24 \
                --outdir /dist \
                --workdir /work \
                --arch x86 \
                --profile "$PROFILE" \
                --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/main \
                --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/community
            '

      - name: Publicar ISO
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-${{ matrix.edition }}-x86
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 7
