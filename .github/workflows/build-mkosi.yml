name: Build ChiquiOS x32

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-mkosi.yml"
      - "chiquios/**"
      - "bacus-pkg/**"

permissions:
  contents: read

concurrency:
  group: chiquios-x32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x32:
    name: ChiquiOS Alpine x32
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Descargar ChiquiOS
        uses: actions/checkout@v4

      - name: Preparar herramientas
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl ca-certificates \
            xorriso squashfs-tools

      - name: Obtener constructor de Alpine
        run: |
          set -euxo pipefail
          git clone --depth 1 \
            https://github.com/alpinelinux/aports.git \
            "$RUNNER_TEMP/aports"

          test -f "$RUNNER_TEMP/aports/scripts/mkimage.sh"

      - name: Verificar requisitos del constructor
        run: |
          set -euxo pipefail
          sed -n '1,180p' \
            "$RUNNER_TEMP/aports/scripts/mkimage.sh"

          echo "El constructor fue descargado."
          echo "Todavía falta preparar su entorno Alpine de construcción."

      - name: Publicar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-x32-build-logs
          path: ${{ runner.temp }}/aports/scripts/mkimage.sh
          if-no-files-found: warn
          retention-days: 3
