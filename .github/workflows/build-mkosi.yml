      - name: Build Alpine ISO using Docker
        run: |
          # Configurar paquetes según la edición
          if [ "${{ matrix.edition }}" = "desktop" ]; then
            PACKAGES="nano curl wget htop python3 git xfce4 xfce4-terminal lightdm"
            PROFILE="xfce"
          else
            PACKAGES="nano curl wget htop python3 git"
            PROFILE="standard"
          fi

          # Ejecutar dentro de Alpine usando el script descargado y syslinux
          sudo docker run --rm --privileged \
            -v "$(pwd)":/work \
            -w /work \
            alpine:latest \
            sh -c "
              apk update &&
              apk add xorriso syslinux squashfs-tools mtools dosfstools wget curl git &&
              wget https://gitlab.alpinelinux.org/alpine/alpine-make-iso/-/raw/master/alpine-make-iso -O /usr/local/bin/alpine-make-iso &&
              chmod +x /usr/local/bin/alpine-make-iso &&
              alpine-make-iso \
                --output 'chiquios-${{ matrix.edition }}-${{ matrix.arch }}.iso' \
                --profile '$PROFILE' \
                --arch '${{ matrix.arch }}' \
                --packages '$PACKAGES' \
                --branch stable
            "
