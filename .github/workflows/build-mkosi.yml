
name: Build ChiquiOS x32

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-mkosi.yml"
      - "chiquios/**"
      - "bacus-pkg/**"

permissions:
  contents: read

concurrency:
  group: chiquios-x32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x32:
    name: ChiquiOS Alpine x32
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Descargar ChiquiOS
        uses: actions/checkout@v4

      - name: Instalar herramientas de construcción
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl ca-certificates \
            xorriso squashfs-tools \
            qemu-user-static binfmt-support

      - name: Preparar Alpine para construir la ISO
        run: |
          set -euxo pipefail
          git clone --depth 1 \
            https://gitlab.alpinelinux.org/alpine/aports.git \
            "$RUNNER_TEMP/aports"

          sudo apt-get install -y \
            alpine-chroot-install

          echo "APORTS_DIR=$RUNNER_TEMP/aports" >> "$GITHUB_ENV"

      - name: Construir ISO Alpine x86
        run: |
          set -euxo pipefail

          echo "ATENCIÓN: el constructor oficial de Alpine necesita"
          echo "un entorno Alpine con apk, abuild y sus dependencias."
          echo "La configuración completa del entorno se debe validar"
          echo "antes de ejecutar mkimage.sh."

          test -f "$APORTS_DIR/scripts/mkimage.sh"
          "$APORTS_DIR/scripts/mkimage.sh" --help

      - name: Publicar registros de construcción
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-x32-build-logs
          path: |
            ${{ runner.temp }}/aports
          if-no-files-found: warn
          retention-days: 3
