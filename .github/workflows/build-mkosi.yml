
name: Build ChiquiOS with Mkosi

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "mkosi.conf"
      - "mkosi.*"
      - "config/**"
      - "scripts/**"
      - "packages/**"
      - "modules/**"
      - "bin/**"
      - ".github/workflows/build-mkosi.yml"

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 8 * * 0"

permissions:
  contents: read

concurrency:
  group: chiquios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ChiquiOS - Debian 13
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout ChiquiOS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          id
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-venv \
            python3-apt \
            systemd-container \
            debootstrap \
            apt \
            debian-archive-keyring \
            ca-certificates \
            curl \
            xz-utils \
            dosfstools \
            e2fsprogs \
            mtools \
            parted \
            qemu-utils \
            grub-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub2-common \
            xorriso \
            squashfs-tools \
            rsync \
            util-linux \
            dbus \
            gnupg

      - name: Download Mkosi
        shell: bash
        run: |
          set -euxo pipefail

          MKOSI_DIR="$RUNNER_TEMP/mkosi"

          git clone \
            --depth 1 \
            https://github.com/systemd/mkosi.git \
            "$MKOSI_DIR"

          MKOSI_BIN="$MKOSI_DIR/bin/mkosi"

          if [ ! -x "$MKOSI_BIN" ]; then
            echo "::error::Mkosi executable was not found."
            exit 1
          fi

          echo "$MKOSI_DIR/bin" >> "$GITHUB_PATH"

          "$MKOSI_BIN" --version

      - name: Validate ChiquiOS configuration
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f mkosi.conf ]; then
            echo "::error::mkosi.conf is missing from the repository root."
            exit 1
          fi

          MKOSI_BIN="$RUNNER_TEMP/mkosi/bin/mkosi"

          "$MKOSI_BIN" summary

      - name: Build ChiquiOS
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail

          MKOSI_BIN="$RUNNER_TEMP/mkosi/bin/mkosi"

          if [ ! -x "$MKOSI_BIN" ]; then
            echo "::error::Mkosi executable is missing."
            exit 1
          fi

          "$MKOSI_BIN" --version

          sudo -E "$MKOSI_BIN" \
            --force \
            --debug \
            build

      - name: Inspect generated images
        if: always()
        shell: bash
        run: |
          set -u

          echo "Searching for generated images..."

          find . -maxdepth 5 -type f \
            \( -name '*.iso' \
            -o -name '*.raw' \
            -o -name '*.img' \
            -o -name '*.qcow2' \
            -o -name '*.manifest' \
            -o -name '*SHA256SUMS*' \) \
            -print || true

          if [ -d mkosi.output ]; then
            echo "Contents of mkosi.output:"
            find mkosi.output -maxdepth 5 -type f -print
          fi

          df -h

      - name: Upload ChiquiOS images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chiquios-debian13-${{ github.sha }}
          path: |
            mkosi.output/**/*.iso
            mkosi.output/**/*.raw
            mkosi.output/**/*.img
            mkosi.output/**/*.qcow2
            mkosi.output/**/*.manifest
            mkosi.output/**/*.SHA256SUMS
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
