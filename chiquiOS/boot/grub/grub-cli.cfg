set timeout=5
set default=0

terminal_input console serial
terminal_output console serial

menuentry "chiquiOS CLI Live (Modo Normal)" {
    insmod iso9660
    set root=(cd)
    linux /boot/vmlinuz boot=live quiet splash console=tty0 console=ttyS0,115200n8
    initrd /initrd.img
}

menuentry "chiquiOS CLI Live (Modo Seguro / Compatible)" {
    insmod iso9660
    set root=(cd)
    linux /boot/vmlinuz boot=live nomodeset console=tty0 console=ttyS0,115200n8
    initrd /initrd.img
}
