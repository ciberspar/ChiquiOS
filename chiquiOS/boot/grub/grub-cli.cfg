set timeout=5
set default=0

terminal_input console serial
terminal_output console serial

menuentry "chiquiOS CLI (Modo Normal)" {
    insmod iso9660
    set root=(cd)
    linux /boot/vmlinuz boot=live quiet splash console=tty0 console=ttyS0,115200n8
    initrd /initrd.img
}

menuentry "chiquiOS CLI (Modo Seguro / Compatibilidad Universal)" {
    insmod iso9660
    set root=(cd)
    linux /boot/vmlinuz boot=live nomodeset vga=normal console=tty0 console=ttyS0,115200n8
    initrd /initrd.img
}
