set timeout=3
set default=0

menuentry "chiquiOS Desktop (GUI + Instalador Gráfico)" {
    linux /boot/vmlinuz root=live:CDLABEL=CHIQUIOS ro console=tty0
    initrd /boot/initrd.img
}

menuentry "chiquiOS CLI (Terminal de Rescate)" {
    linux /boot/vmlinuz root=live:CDLABEL=CHIQUIOS ro console=ttyS0
    initrd /boot/initrd.img
}
