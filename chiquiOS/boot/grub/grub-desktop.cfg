set timeout=5
set default=0

insmod normal
insmod video
insmod font
if loadfont /boot/grub/fonts/unicode.pf2; then
  insmod gfxterm
  set gfxmode=auto
  terminal_output gfxterm console
else
  terminal_output console
fi

menuentry "chiquiOS Desktop Live (Normal)" {
    linux /boot/vmlinuz boot=live root=live:CDLABEL=CHIQUIOS quiet splash
    initrd /initrd.img
}

menuentry "chiquiOS Desktop Live (Modo Seguro / Texto)" {
    linux /boot/vmlinuz boot=live root=live:CDLABEL=CHIQUIOS nomodeset
    initrd /initrd.img
}
