set timeout=5
set default=0

# Permitir tanto la consola de texto estándar como el puerto serie
terminal_input console serial
terminal_output console serial

menuentry "chiquiOS Desktop (Modo Normal / GUI)" {
    insmod iso9660
    set root=(cd)
    linux /boot/vmlinuz boot=live quiet splash
    initrd /initrd.img
}

menuentry "chiquiOS Desktop (Modo Seguro / VESA / Emuladores)" {
    insmod iso9660
    set root=(cd)
    linux /boot/vmlinuz boot=live nomodeset vga=normal
    initrd /initrd.img
}

menuentry "chiquiOS Desktop (Consola Serie / CLI)" {
    insmod iso9660
    set root=(cd)
    linux /boot/vmlinuz boot=live console=tty0 console=ttyS0,115200n8 nomodeset
    initrd /initrd.img
}
