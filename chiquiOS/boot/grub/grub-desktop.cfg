set timeout=5
set default=0

# Terminales y consolas de entrada
serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1
terminal_input console serial

# Carga de módulos de video universales
insmod all_video
insmod vbe
insmod vga
insmod gfxterm
insmod font

# Salida simultánea para pantallas gráficas, consola de texto y terminal serial
if loadfont /boot/grub/fonts/unicode.pf2 ; then
  set gfxmode=auto
  set gfxpayload=keep
  terminal_output gfxterm console serial
else
  terminal_output console serial
fi

menuentry "chiquiOS Desktop Live (Pantalla y Terminal)" {
    linux /boot/vmlinuz boot=live root=live:CDLABEL=CHIQUIOS quiet splash console=tty0 console=ttyS0,115200n8
    initrd /initrd.img
}

menuentry "chiquiOS Desktop Live (Modo Seguro / Compatible VGA)" {
    linux /boot/vmlinuz boot=live root=live:CDLABEL=CHIQUIOS nomodeset console=tty0 console=ttyS0,115200n8
    initrd /initrd.img
}
