set timeout=5
set default=0

# Soportar entrada desde teclado de pantalla y terminal serie
serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1
terminal_input console serial

# Cargar controladores de pantalla
insmod all_video
insmod vbe
insmod vga
insmod gfxterm

# Salida limpia: intenta gráficos, cae a consola simple sin glifos raros
terminal_output gfxterm console

menuentry "chiquiOS Desktop Live" {
    linux /boot/vmlinuz boot=live root=live:CDLABEL=CHIQUIOS quiet splash console=tty0 console=ttyS0,115200n8
    initrd /initrd.img
}

menuentry "chiquiOS Desktop Live (Modo Texto Puro / VGA Safe)" {
    linux /boot/vmlinuz boot=live root=live:CDLABEL=CHIQUIOS nomodeset console=tty0 console=ttyS0,115200n8
    initrd /initrd.img
}
