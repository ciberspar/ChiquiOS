set timeout=5
set default=0

# Cargar módulos de video y terminal universales
insmod all_video
insmod vbe
insmod vga
insmod gfxterm

# Habilitar entrada y salida dual (Pantalla y Terminal Serie)
serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output gfxterm console serial

menuentry "chiquiOS Desktop Live (Normal / Pantalla y Serial)" {
    linux /boot/vmlinuz boot=live root=live:CDLABEL=CHIQUIOS quiet splash console=tty0 console=ttyS0,115200n8
    initrd /initrd.img
}

menuentry "chiquiOS Desktop Live (Modo Seguro / Texto Compatible)" {
    linux /boot/vmlinuz boot=live root=live:CDLABEL=CHIQUIOS nomodeset console=tty0 console=ttyS0,115200n8
    initrd /initrd.img
}
